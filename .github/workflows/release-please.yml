name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Check out release PR
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
      - name: Install Rust toolchain
        if: steps.release.outputs.prs_created == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Synchronize release lockfile
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          RELEASE_PR_BRANCH="$(jq -er '.headBranchName' <<< "$RELEASE_PR")"
          cargo update --workspace
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi

          git add Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: synchronize Cargo.lock for release"
          git push origin "HEAD:$RELEASE_PR_BRANCH"

  build:
    name: Build ${{ matrix.target }}
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-on-failure: true
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libzstd-dev pkg-config protobuf-compiler
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Configure linker (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.x86_64-unknown-linux-gnu]
          rustflags = ["-C", "link-arg=-Wl,--allow-multiple-definition"]

          [target.aarch64-unknown-linux-gnu]
          rustflags = ["-C", "link-arg=-Wl,--allow-multiple-definition"]
          EOF
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/nestweaver-web/frontend/package-lock.json
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: crates/nestweaver-web/frontend
      - name: Build target OpenSSL
        shell: bash
        run: |
          cargo build --locked --release --target "${{ matrix.target }}" -p openssl-sys
          OPENSSL_INSTALL="$(find "target/${{ matrix.target }}/release/build" -type d -path '*/openssl-sys-*/out/openssl-build/install' -print -quit)"
          test -n "$OPENSSL_INSTALL"
          OPENSSL_INSTALL="$(cd "$OPENSSL_INSTALL" && pwd)"
          test -f "$OPENSSL_INSTALL/lib/libssl.a"
          test -f "$OPENSSL_INSTALL/lib/libcrypto.a"
          test -f "$OPENSSL_INSTALL/include/openssl/ssl.h"
          test -f "$OPENSSL_INSTALL/include/openssl/opensslconf.h"
          test -f "$OPENSSL_INSTALL/lib/pkgconfig/openssl.pc"
          {
            echo "OPENSSL_DIR=$OPENSSL_INSTALL"
            echo "OPENSSL_ROOT_DIR=$OPENSSL_INSTALL"
            echo "OPENSSL_LIB_DIR=$OPENSSL_INSTALL/lib"
            echo "OPENSSL_INCLUDE_DIR=$OPENSSL_INSTALL/include"
            echo "OPENSSL_STATIC=1"
            echo "CMAKE_PREFIX_PATH=$OPENSSL_INSTALL"
          } >> "$GITHUB_ENV"
      - name: Build binary
        run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          LBUG_BUILD_FROM_SOURCE: "1"
      - name: Verify release binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/nestweaver"
          FILE_INFO="$(file "$BIN")"
          echo "$FILE_INFO"

          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) echo "$FILE_INFO" | grep -q 'x86-64' ;;
            aarch64-unknown-linux-gnu) echo "$FILE_INFO" | grep -Eq 'ARM aarch64|ARM64' ;;
            x86_64-apple-darwin) echo "$FILE_INFO" | grep -q 'x86_64' ;;
            aarch64-apple-darwin) echo "$FILE_INFO" | grep -Eq 'arm64|ARM64' ;;
          esac

          if [ "${{ runner.os }}" = "macOS" ]; then
            otool -L "$BIN" | tee linked-libraries.txt
            if grep -Eq '/opt/homebrew|/usr/local|libssl|libcrypto' linked-libraries.txt; then
              echo "release binary has a non-system OpenSSL dependency" >&2
              exit 1
            fi
          else
            readelf -d "$BIN" | tee linked-libraries.txt
            if grep -Eq 'Shared library: \[lib(ssl|crypto)\.so' linked-libraries.txt; then
              echo "release binary has a dynamic OpenSSL dependency" >&2
              exit 1
            fi
          fi

          HOST="$(uname -s)-$(uname -m)"
          case "$HOST:${{ matrix.target }}" in
            Linux-x86_64:x86_64-unknown-linux-gnu|Linux-aarch64:aarch64-unknown-linux-gnu|Darwin-x86_64:x86_64-apple-darwin|Darwin-arm64:aarch64-apple-darwin)
              "$BIN" --version
              ;;
          esac
      - name: Package binary
        run: |
          ARCHIVE="nestweaver-${{ needs.release-please.outputs.tag_name }}-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" nestweaver
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
      - name: Generate SHA-256 checksum
        run: shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ARCHIVE }}
      - name: Upload release artifact
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  publish-npm:
    name: Publish npm wrapper
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # The wrapper's postinstall downloads the matching release binary, so it
      # must publish only after the `build` job has uploaded the assets for
      # this tag. No-ops with a clear message until NPM_TOKEN is configured,
      # so releases stay green before the secret exists.
      - name: Publish to npm
        working-directory: npm
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not set — skipping npm publish."
            echo "Add the NPM_TOKEN repo secret to enable automatic publishing."
            exit 0
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
