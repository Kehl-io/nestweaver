name: Release Please

on:
  push:
    branches: [main]
  # A release artifact is materially different from the ordinary CI binary:
  # it is built on the compatibility runner, with the release linker and the
  # exact runtime layout users download. Allow that contract to be exercised
  # before cutting another public tag when a platform-specific failure needs
  # diagnosis. A manual run builds and verifies the matrix but cannot publish.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Find the open release PR by LABEL, not by `prs_created`.
      #
      # `prs_created` is true only when release-please CREATES the PR. When it
      # UPDATES an existing one -- every subsequent push to main -- it is false,
      # so the lockfile sync below never ran. That is not hypothetical: PR #331
      # sat with Cargo.toml at 9.0.0 and Cargo.lock still at 8.0.0, a state
      # `cargo build --locked` refuses outright (verified: exit 101, "cannot
      # update the lock file ... because --locked was passed"). Merging it would
      # have CUT THE TAG and then failed every one of the four binary builds,
      # publishing a release with no artifacts -- and the release PR is the one
      # PR in this repo that gets no CI, so nothing would have caught it.
      #
      # `autorelease: pending` is release-please's own label on an open release
      # PR and is present however the PR got there.
      - name: Locate the open release PR
        id: release_pr
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION_PR: ${{ steps.release.outputs.pr }}
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
        run: |
          set -euo pipefail
          NUM=""
          BRANCH=""

          # PREFER THE ACTION'S OWN OUTPUT. When release-please has just CREATED
          # the PR, its `autorelease: pending` label is not attached yet: PR #338
          # was created at 04:49:05 and the label lookup here ran within five
          # seconds, matched nothing, and skipped the sync -- reproducing the
          # exact defect the lookup was added to fix, on the very next release.
          # The action's output is populated in-process and cannot race.
          if [ -n "${ACTION_PR:-}" ] && [ "$ACTION_PR" != "null" ]; then
            NUM="$(jq -r '.number // empty' <<< "$ACTION_PR")"
            BRANCH="$(jq -r '.headBranchName // empty' <<< "$ACTION_PR")"
          fi

          # FALL BACK TO THE LABEL for a PR that already existed and was merely
          # UPDATED -- the case that has no `pr` output at all, and the reason
          # 9.0.0 shipped with a stale lockfile. Retry: a just-labelled PR can
          # take a moment to appear in the list API.
          if [ -z "$NUM" ]; then
            for attempt in 1 2 3; do
              PR_JSON="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
                --label 'autorelease: pending' --json number,headRefName --limit 1)"
              NUM="$(jq -r '.[0].number // empty' <<< "$PR_JSON")"
              BRANCH="$(jq -r '.[0].headRefName // empty' <<< "$PR_JSON")"
              [ -n "$NUM" ] && break
              echo "no open release PR yet (attempt $attempt/3); retrying in 5s"
              sleep 5
            done
          fi

          # If the action says it created a PR and we still cannot find it, that
          # is an inconsistency, not an absence. Failing here is far cheaper than
          # discovering it after the tag is public.
          if [ "${PRS_CREATED:-false}" = "true" ] && [ -z "$NUM" ]; then
            echo "::error::release-please reported creating a PR but none could be located; refusing to skip the lockfile sync" >&2
            exit 1
          fi

          echo "located release PR: ${NUM:-<none>} (${BRANCH:-<none>})"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Check out release PR
        if: steps.release_pr.outputs.number != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_pr.outputs.branch }}
      - name: Install Rust toolchain
        if: steps.release_pr.outputs.number != ''
        uses: dtolnay/rust-toolchain@stable
      - name: Synchronize release lockfile
        if: steps.release_pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ steps.release_pr.outputs.number }}
          RELEASE_PR_BRANCH: ${{ steps.release_pr.outputs.branch }}
        run: |
          set -euo pipefail

          cargo update --workspace

          if ! git diff --quiet -- Cargo.lock; then
            git add Cargo.lock
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: synchronize Cargo.lock for release"
            git push origin "HEAD:$RELEASE_PR_BRANCH"
          fi

          # Prove the state we are about to let someone merge actually builds.
          # `cargo update --workspace` exiting 0 is not that proof: it says the
          # lock was refreshed, not that --locked now accepts it, and --locked
          # is what the build job uses.
          cargo metadata --locked --format-version 1 > /dev/null

          if [ "$(gh pr view "$RELEASE_PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true" ]; then
            gh pr ready "$RELEASE_PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GNU archives are built on the OLDEST supported runner on
          # purpose. glibc is backward compatible, not forward: a binary built
          # against 2.39 will not start on 2.35, so the build host's glibc IS
          # the compatibility floor shipped to users. `ubuntu-latest` moved to
          # 24.04 and silently raised that floor to 2.39, which is why the
          # public v8.0.0 GNU archive cannot start on Ubuntu 22.04 (2.35),
          # Debian 12 (2.36) or RHEL 9 (2.34). Pinning 22.04 covers all three.
          # The `Verify release binary` step enforces the floor rather than
          # trusting this pin.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            features: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            features: ""
          - target: x86_64-apple-darwin
            os: macos-15-intel
            features: metal
          - target: aarch64-apple-darwin
            os: macos-latest
            features: metal
    steps:
      - name: Verify native runner architecture
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          HOST_ARCH="$(uname -m)"
          case "$TARGET:$HOST_ARCH" in
            x86_64-*:x86_64|aarch64-unknown-linux-gnu:aarch64|aarch64-apple-darwin:arm64) ;;
            *)
              echo "Runner architecture $HOST_ARCH does not match target $TARGET" >&2
              exit 1
              ;;
          esac
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-on-failure: true
      # GCC 13 is REQUIRED and is not available in the 22.04 base archive.
      #
      # The runners are pinned to 22.04 so the shipped glibc floor is 2.35 (see
      # the matrix comment). lbug 0.19.1 requires BOTH C++20 `std::format` and,
      # on x86_64, AVX-512 FP16 intrinsics. Ubuntu 22.04's GCC 11 has neither;
      # GCC 12 has the intrinsics but its libstdc++ still has no `<format>`.
      # GCC 13 is the first version that satisfies both requirements.
      #
      # The toolchain PPA also supplies a newer dynamic C++ runtime, which a
      # stock 22.04 installation does not have. The checked-in linker wrapper
      # records `$ORIGIN/lib` as the runtime search path, and the packaging step
      # ships the matching GCC 13 libstdc++ and libgcc beside the binary. Do not
      # statically link them: the v9.0.3 artifacts passed `--version` but
      # segfaulted on the first LadybugDB open across its Rust/C++ boundary.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y cmake gcc-13 g++-13 gdb libssl-dev libzstd-dev pkg-config protobuf-compiler
          LINKER="$GITHUB_WORKSPACE/scripts/gcc13-bundled-cxx-linker"
          test -x "$LINKER"
          {
            echo "CC=gcc-13"
            echo "CXX=g++-13"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=$LINKER"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=$LINKER"
          } >> "$GITHUB_ENV"
      - name: Verify the Linux C++20 and architecture toolchain
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          gcc-13 --version | head -1
          g++-13 --version | head -1

          # This catches the v9.0.1 x86_64 failure (`<format>` missing) on both
          # architectures before the full LadybugDB build begins.
          printf '%s\n' \
            '#include <format>' \
            '#include <string>' \
            'int main() { return std::format("{}", 42) == "42" ? 0 : 1; }' \
            > "$RUNNER_TEMP/cxx20-format-probe.cpp"
          g++-13 -std=c++20 "$RUNNER_TEMP/cxx20-format-probe.cpp" \
            -o "$RUNNER_TEMP/cxx20-format-probe"
          "$RUNNER_TEMP/cxx20-format-probe"

          # AVX-512 is an x86 ISA. Running this probe on the native ARM64 job
          # caused the other v9.0.1 failure before Cargo even started.
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            printf '%s\n' \
              '#include <immintrin.h>' \
              '__attribute__((target("avx512fp16")))' \
              'static __m512h probe(__m512h a, __m512h b) { return _mm512_add_ph(a, b); }' \
              'int main(void) { (void)probe; return 0; }' \
              > "$RUNNER_TEMP/fp16-probe.c"
            gcc-13 -c "$RUNNER_TEMP/fp16-probe.c" \
              -o "$RUNNER_TEMP/fp16-probe.o" -mavx512fp16
          fi
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Configure macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # LadybugDB uses floating-point std::format, available since macOS 13.3.
          case "${{ matrix.target }}" in
            x86_64-apple-darwin|aarch64-apple-darwin) DEPLOYMENT_TARGET=13.3 ;;
            *)
              echo "Unsupported macOS target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac
          echo "MACOSX_DEPLOYMENT_TARGET=$DEPLOYMENT_TARGET" >> "$GITHUB_ENV"
      # Do not use mold for release artifacts. Both v9.0.4 Linux binaries linked
      # by mold started and printed their versions, then segfaulted as soon as
      # LadybugDB opened a database. The same GCC 13 source build linked with
      # GNU ld passes that operation, and native upstream Ladybug builds also
      # use the system linker. Link speed is not an artifact requirement.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/nestweaver-web/frontend/package-lock.json
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: crates/nestweaver-web/frontend
      - name: Compute native dependency cache key
        id: nativekey
        shell: bash
        run: |
          LBUG_VER=$(awk '/^name = "lbug"$/{getline; print $3}' Cargo.lock | tr -d '"')
          OSSL_VER=$(awk '/^name = "openssl-sys"$/{getline; print $3}' Cargo.lock | tr -d '"')
          RUSTC_VER=$(rustc --version | awk '{print $2}')
          if [ "${{ runner.os }}" = "Linux" ]; then
            CXX_VER=$("$CXX" -dumpfullversion -dumpversion)
            LINKER_HASH=$(shasum -a 256 scripts/gcc13-bundled-cxx-linker | cut -c1-12)
            TOOLCHAIN_KEY="gcc${CXX_VER}-bundledcxx${LINKER_HASH}"
          else
            TOOLCHAIN_KEY=$(clang --version | shasum -a 256 | cut -c1-16)
          fi
          echo "key=${LBUG_VER}-${OSSL_VER}-rustc${RUSTC_VER}-${TOOLCHAIN_KEY}" >> "$GITHUB_OUTPUT"
      - name: Cache native build outputs (lbug C++, OpenSSL)
        # Keyed on package versions (not Cargo.lock) so the cache survives
        # release lockfile churn; per-target and per-native-toolchain so an
        # incomplete GCC 12 build cannot poison the GCC 13 repair job.
        uses: actions/cache@v6
        with:
          path: |
            target/**/build/lbug-*/out
            target/**/build/openssl-sys-*/out
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.nativekey.outputs.key }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
      - name: Build target OpenSSL
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --locked --release --target "$TARGET" -p openssl-sys
          OPENSSL_SOURCE="$(find "target/$TARGET/release/build" -type d -path '*/openssl-sys-*/out/openssl-build/install' -print -quit)"
          test -n "$OPENSSL_SOURCE"
          OPENSSL_SOURCE="$(cd "$OPENSSL_SOURCE" && pwd)"
          test -n "$RUNNER_TEMP"
          OPENSSL_INSTALL="$RUNNER_TEMP/nestweaver-openssl/$TARGET"
          mkdir -p "$OPENSSL_INSTALL"
          cp -R "$OPENSSL_SOURCE/." "$OPENSSL_INSTALL/"
          test -f "$OPENSSL_INSTALL/lib/libssl.a"
          test -f "$OPENSSL_INSTALL/lib/libcrypto.a"
          test -f "$OPENSSL_INSTALL/include/openssl/ssl.h"
          test -f "$OPENSSL_INSTALL/include/openssl/opensslconf.h"
          test -f "$OPENSSL_INSTALL/lib/pkgconfig/openssl.pc"
          {
            echo "OPENSSL_DIR=$OPENSSL_INSTALL"
            echo "OPENSSL_ROOT_DIR=$OPENSSL_INSTALL"
            echo "OPENSSL_LIB_DIR=$OPENSSL_INSTALL/lib"
            echo "OPENSSL_INCLUDE_DIR=$OPENSSL_INSTALL/include"
            echo "OPENSSL_STATIC=1"
            echo "CMAKE_PREFIX_PATH=$OPENSSL_INSTALL"
          } >> "$GITHUB_ENV"
      - name: Configure Intel macOS compiler runtime
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          CLANG_RT="$(clang --print-resource-dir)/lib/darwin/libclang_rt.osx.a"
          test -f "$CLANG_RT"
          lipo "$CLANG_RT" -verify_arch x86_64
          nm -arch x86_64 "$CLANG_RT" | grep '___cpu_model'
          echo "CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS=-Clink-arg=$CLANG_RT" >> "$GITHUB_ENV"
      - name: Build binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features }}
          LBUG_BUILD_FROM_SOURCE: "1"
          # Normal CI has always disabled Ladybug's vendored zstd assembly;
          # release artifacts must compile the same native code path. Besides
          # avoiding hidden ELF Huffman symbols, this removes architecture-
          # specific assembly from the ARM64 crash surface.
          CFLAGS: "-DZSTD_DISABLE_ASM"
        run: |
          if [ -n "$FEATURES" ]; then
            cargo build --locked --release --target "$TARGET" --features "$FEATURES"
          else
            cargo build --locked --release --target "$TARGET"
          fi
      - name: Stage Linux compiler runtime
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          RUNTIME_DIR="target/$TARGET/release/lib"
          mkdir -p "$RUNTIME_DIR"
          CXX_RUNTIME="$(g++-13 -print-file-name=libstdc++.so.6)"
          GCC_RUNTIME="$(gcc-13 -print-file-name=libgcc_s.so.1)"
          test -f "$CXX_RUNTIME"
          test -f "$GCC_RUNTIME"
          test -f /usr/share/doc/libstdc++6/copyright
          cp -L "$CXX_RUNTIME" "$RUNTIME_DIR/libstdc++.so.6"
          cp -L "$GCC_RUNTIME" "$RUNTIME_DIR/libgcc_s.so.1"
          cp /usr/share/doc/libstdc++6/copyright "$RUNTIME_DIR/LICENSE-GCC-runtime"
      - name: Verify release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          BIN="target/$TARGET/release/nestweaver"
          FILE_INFO="$(file "$BIN")"
          echo "$FILE_INFO"

          case "$TARGET" in
            x86_64-unknown-linux-gnu) echo "$FILE_INFO" | grep -q 'x86-64' ;;
            aarch64-unknown-linux-gnu) echo "$FILE_INFO" | grep -Eq 'ARM aarch64|ARM64' ;;
            x86_64-apple-darwin) echo "$FILE_INFO" | grep -q 'x86_64' ;;
            aarch64-apple-darwin) echo "$FILE_INFO" | grep -Eq 'arm64|ARM64' ;;
          esac

          if [ "${{ runner.os }}" = "macOS" ]; then
            otool -L "$BIN" | tee linked-libraries.txt
            if grep -Eq '/opt/homebrew|/usr/local|libssl|libcrypto' linked-libraries.txt; then
              echo "release binary has a non-system OpenSSL dependency" >&2
              exit 1
            fi
          else
            RUNTIME_DIR="target/$TARGET/release/lib"
            readelf -d "$BIN" | tee linked-libraries.txt
            if grep -Eq 'Shared library: \[lib(ssl|crypto)\.so' linked-libraries.txt; then
              echo "release binary has a non-system OpenSSL dependency" >&2
              exit 1
            fi
            for runtime in libstdc++.so.6 libgcc_s.so.1; do
              if ! grep -Fq "Shared library: [$runtime]" linked-libraries.txt; then
                echo "release binary does not declare $runtime" >&2
                exit 1
              fi
              test -f "$RUNTIME_DIR/$runtime"
            done
            if ! readelf -d "$BIN" | grep -Fq "Library runpath: [\$ORIGIN/lib]"; then
              echo "release binary must resolve its bundled GCC runtime from \$ORIGIN/lib" >&2
              exit 1
            fi

            ldd "$BIN" | tee resolved-libraries.txt
            for runtime in libstdc++.so.6 libgcc_s.so.1; do
              expected="$(cd "$RUNTIME_DIR" && pwd)/$runtime"
              if ! grep -Fq "$runtime => $expected" resolved-libraries.txt; then
                echo "$runtime did not resolve to the copy staged in the release archive" >&2
                exit 1
              fi
            done

            # Enforce the declared glibc baseline. The runner pin above sets
            # this floor, but a pin is a claim about the build host; this reads
            # the requirement back off the ARTIFACT WE ARE ABOUT TO SHIP, which
            # is the only thing users run. Without it, a future runner-image
            # bump raises the floor silently again -- exactly how the v8.0.0
            # archive shipped requiring GLIBC_2.39.
            GLIBC_BASELINE=2.35
            MAX_GLIBC="$(
              for artifact in "$BIN" "$RUNTIME_DIR/libstdc++.so.6" "$RUNTIME_DIR/libgcc_s.so.1"; do
                readelf -V "$artifact" 2>/dev/null || true
              done \
                | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -uV | tail -1
            )"
            echo "max glibc required by artifact: ${MAX_GLIBC:-none}"
            if [ -z "$MAX_GLIBC" ]; then
              echo "::error::could not read glibc requirements from $BIN; refusing to ship an unverified floor" >&2
              exit 1
            fi
            if [ "$(printf '%s\n%s\n' "$MAX_GLIBC" "$GLIBC_BASELINE" | sort -V | tail -1)" != "$GLIBC_BASELINE" ]; then
              echo "::error::artifact requires GLIBC_$MAX_GLIBC, above the declared baseline of $GLIBC_BASELINE." >&2
              echo "It will not start on the declared Ubuntu 22.04 (2.35) baseline." >&2
              echo "Either build on an older runner or raise the baseline deliberately and document it in INSTALL.md." >&2
              exit 1
            fi
          fi

          HOST="$(uname -s)-$(uname -m)"
          case "$HOST:$TARGET" in
            Linux-x86_64:x86_64-unknown-linux-gnu|Linux-aarch64:aarch64-unknown-linux-gnu|Darwin-x86_64:x86_64-apple-darwin|Darwin-arm64:aarch64-apple-darwin)
              "$BIN" --version
              SMOKE_DIR="$(mktemp -d "$RUNNER_TEMP/nestweaver-release-smoke.XXXXXX")"
              trap 'rm -rf "$SMOKE_DIR"' EXIT
              if NESTWEAVER_ALLOW_NO_DAEMON=1 NESTWEAVER_NO_DAEMON=1 \
                "$BIN" index \
                    --repo "$GITHUB_WORKSPACE/crates/nestweaver-parser/tests" \
                    --name release-artifact-smoke \
                    --db "$SMOKE_DIR/smoke.lbug" \
                    --no-embed \
                    --with-trigrams \
                    --json; then
                :
              else
                SMOKE_STATUS=$?
                if [ "${{ runner.os }}" = "Linux" ]; then
                  DEBUG_DIR="$(mktemp -d "$RUNNER_TEMP/nestweaver-release-debug.XXXXXX")"
                  NESTWEAVER_ALLOW_NO_DAEMON=1 NESTWEAVER_NO_DAEMON=1 \
                    gdb --batch --quiet \
                      -ex run \
                      -ex 'thread apply all backtrace' \
                      --args "$BIN" index \
                        --repo "$GITHUB_WORKSPACE/crates/nestweaver-parser/tests" \
                        --name release-artifact-debug \
                        --db "$DEBUG_DIR/debug.lbug" \
                        --no-embed \
                        --with-trigrams \
                        --json || true
                fi
                exit "$SMOKE_STATUS"
              fi
              ;;
          esac
      - name: Verify Apple Metal capability
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          BIN="target/$TARGET/release/nestweaver"
          CAPABILITIES="$("$BIN" diagnostics capabilities --json)"
          printf '%s\n' "$CAPABILITIES"
          jq -e '.metal_compiled == true' <<< "$CAPABILITIES"
      - name: Package binary
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ARCHIVE="nestweaver-${{ needs.release-please.outputs.tag_name }}-$TARGET.tar.gz"
          if [[ "$TARGET" == *-unknown-linux-gnu ]]; then
            tar czf "$ARCHIVE" -C "target/$TARGET/release" nestweaver lib
          else
            tar czf "$ARCHIVE" -C "target/$TARGET/release" nestweaver
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
      - name: Generate SHA-256 checksum
        if: github.event_name != 'workflow_dispatch'
        run: shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
      - name: Attest build provenance
        if: github.event_name != 'workflow_dispatch'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ARCHIVE }}
      - name: Upload release artifact
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  publish-npm:
    name: Publish npm wrapper
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # The wrapper's postinstall downloads the matching release binary, so it
      # must publish only after the `build` job has uploaded the assets for
      # this tag.
      #
      # This step FAILS rather than skips when the token is absent. It used to
      # exit 0 with a "skipping" message so releases stayed green before the
      # secret existed -- and the result was that every release since the
      # wrapper was added reported success while publishing nothing, which is
      # how the package reached 8.0.0 having never been published at all
      # (nw-115). A release job that cannot publish must say so.
      - name: Publish to npm
        working-directory: npm
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not set, so the npm wrapper cannot be published." >&2
            echo "Add the NPM_TOKEN repository secret. A release must not report" >&2
            echo "success while silently dropping a distribution channel (nw-115)." >&2
            exit 1
          fi
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          npm publish --access public
          # Read it back. `npm publish` exiting 0 is a claim, not evidence: a
          # publish that is not resolvable from the registry did not happen, and
          # trusting the exit code is the exact failure this step is here to
          # stop. Retry only for registry propagation lag.
          for attempt in 1 2 3 4 5; do
            if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
              echo "Verified $NAME@$VERSION is resolvable from the registry."
              exit 0
            fi
            echo "Registry has not caught up (attempt $attempt/5); retrying in 10s."
            sleep 10
          done
          echo "::error::npm publish exited 0 but $NAME@$VERSION is not resolvable." >&2
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
