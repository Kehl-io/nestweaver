name: Coverage

on:
  push:
    branches: [main]
  # Validate extraction on PRs that change this workflow itself.
  pull_request:
    branches: [main, staging]
    paths: [.github/workflows/coverage.yml]
  # Select the candidate branch/ref for explicit instrumented validation.
  workflow_dispatch:

permissions:
  contents: read

# Independent of CI-main: informational coverage must not hold required runs.
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  LBUG_BUILD_FROM_SOURCE: "1"
  CFLAGS: "-DZSTD_DISABLE_ASM"
  # mold, purely for link speed. Set as an env override rather than appended to
  # .cargo/config.toml: a second [target.x86_64-unknown-linux-gnu] table is a
  # TOML duplicate key and fails the build outright. No duplicate-symbol
  # suppression belongs here — exactly one copy of zstd is linked, so nothing
  # needs tolerating. See .cargo/config.toml.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - 'tests/support/isolated_daemon.py'
              - 'tests/support/release_*.py'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/coverage.yml'
              - '.github/workflows/release-please.yml'
              - '.github/CODEOWNERS'
              - '.github/main-ruleset.json'
              - 'CONTRIBUTING.md'
              - 'release-please-config.json'
              - 'scripts/observe-release-visibility.sh'
              - 'scripts/verify-release-canary-pr.sh'
              - 'scripts/verify-release-bundle.sh'
              - 'scripts/verify-release-package.sh'
              - 'scripts/verify-required-ci.sh'
              - 'scripts/verify-main-rules.sh'
              - 'scripts/verify-linux-archive.py'
              - 'scripts/verify-release-fault.py'
              - 'scripts/test-verify-release-fault.py'
              - 'scripts/run-backlog-benchmarks.sh'
              # The pinned LadybugDB source every compiling job builds from,
              # and the other build entry points that fetch it.
              - 'scripts/fetch-lbug-source.sh'
              - 'Dockerfile'
              - '.dockerignore'
              - '.devcontainer/**'
              - 'examples/**'
              - 'instance.toml'
              - 'INSTALL.md'
              - 'README.md'
              - 'CLAUDE.md'
              - 'docs/**'
              - 'npm/**'
              - 'smithery.yaml'
  coverage:
    name: Coverage
    # Higher than the others: coverage instruments every crate and its five
    # observed green runs averaged 105m.
    timeout-minutes: 180
    needs: changes
    # Coverage is informational (uploads an lcov artifact; nothing gates on it)
    # and is the single slowest job — a full *instrumented* recompile. Keep it
    # main-only by default, with an explicit branch validation for backlog work.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
        with:
          components: llvm-tools-preview
      - name: Check out the pinned LadybugDB source
        # Sets LBUG_SOURCE_DIR for the lbug build. The tag and commit live
        # in scripts/fetch-lbug-source.sh only.
        run: scripts/fetch-lbug-source.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          shared-key: coverage-deps-only
          cache-targets: false
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@2af88edc33c2d5ff8a473fd1c5ab83052f77afee # cargo-llvm-cov 2026-09-02
        with:
          tool: cargo-llvm-cov
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libzstd-dev pkg-config protobuf-compiler mold
      - name: Compute native dependency cache key
        id: nativekey
        run: |
          LBUG_VER=$(awk '/^name = "lbug"$/{getline; print $3}' Cargo.lock | tr -d '"')
          OSSL_VER=$(awk '/^name = "openssl-sys"$/{getline; print $3}' Cargo.lock | tr -d '"')
          RUSTC_VER=$(rustc --version | awk '{print $2}')
          echo "key=${LBUG_VER}-${OSSL_VER}-rustc${RUSTC_VER}" >> "$GITHUB_OUTPUT"
      - name: Cache native build outputs (lbug C++, OpenSSL)
        # lbug (C++ graph DB, built from source) and vendored OpenSSL dominate
        # cold-build time. Keyed on their package versions (not Cargo.lock as a
        # whole) so they survive release-please lockfile churn.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            target/**/build/lbug-*/out
            target/**/build/openssl-sys-*/out
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ steps.nativekey.outputs.key }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-
      - name: Record coverage runner disk before instrumentation
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh target 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Generate coverage
        # --workspace so coverage reflects the whole codebase, not just the root
        # package (see the Tests step note on the [package]+[workspace] manifest).
        run: cargo llvm-cov --workspace --features ci-direct-tests --no-fail-fast --lcov --output-path lcov.info -- --skip daemon_
        env:
          # Explicit, because this PR stops `CI`/`GITHUB_ACTIONS` from conferring
          # the bypass. An ambient variable set by dozens of unrelated tools must
          # not decide whether a database can have two writers; a job that wants
          # the escape hatch now says so.
          NESTWEAVER_ALLOW_NO_DAEMON: "1"
          NESTWEAVER_NO_DAEMON: "1"
      - name: Report coverage runner disk usage
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh target 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: lcov.info

