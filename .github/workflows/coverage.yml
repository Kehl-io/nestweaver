name: Coverage

on:
  # Informational instrumentation is expensive; collect it weekly or on demand.
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:
    inputs:
      cache_mode:
        description: 'Capacity validation: cold skips restores; warm requires the exact native cache'
        type: choice
        options: [normal, cold, warm]
        default: normal

permissions:
  contents: read

# Independent of CI-main: informational coverage must not hold required runs.
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  LBUG_BUILD_FROM_SOURCE: "1"
  CFLAGS: "-DZSTD_DISABLE_ASM"
  COVERAGE_CACHE_MODE: ${{ inputs.cache_mode || 'normal' }}
  # mold, purely for link speed. Set as an env override rather than appended to
  # .cargo/config.toml: a second [target.x86_64-unknown-linux-gnu] table is a
  # TOML duplicate key and fails the build outright. No duplicate-symbol
  # suppression belongs here — exactly one copy of zstd is linked, so nothing
  # needs tolerating. See .cargo/config.toml.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  coverage:
    name: Coverage
    # Higher than the others: coverage instruments every crate and its five
    # observed green runs averaged 105m.
    timeout-minutes: 180
    # Coverage is informational (uploads an lcov artifact; nothing gates on it)
    # and requires a full instrumented recompile. Required CI validates this
    # definition; scheduled/manual runs perform the instrumentation.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
        with:
          components: llvm-tools-preview
      - name: Check out the pinned LadybugDB source
        # Sets LBUG_SOURCE_DIR for the lbug build. The tag and commit live
        # in scripts/fetch-lbug-source.sh only.
        run: scripts/fetch-lbug-source.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: inputs.cache_mode != 'cold'
        with:
          # Only main saves; PR caches would evict main's under the repo cap.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          shared-key: coverage-deps-only
          cache-targets: false
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # cargo-llvm-cov 2026-09-02
        with:
          tool: cargo-llvm-cov
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libzstd-dev pkg-config protobuf-compiler mold lcov
      - name: Compute native dependency cache key
        id: nativekey
        run: |
          LBUG_VER=$(awk '/^name = "lbug"$/{getline; print $3}' Cargo.lock | tr -d '"')
          OSSL_VER=$(awk '/^name = "openssl-sys"$/{getline; print $3}' Cargo.lock | tr -d '"')
          RUSTC_VER=$(rustc --version | awk '{print $2}')
          echo "key=${LBUG_VER}-${OSSL_VER}-rustc${RUSTC_VER}" >> "$GITHUB_OUTPUT"
      - name: Cache native build outputs (lbug C++, OpenSSL)
        id: nativecache
        if: inputs.cache_mode != 'cold'
        # lbug (C++ graph DB, built from source) and vendored OpenSSL dominate
        # cold-build time. Keyed on their package versions (not Cargo.lock as a
        # whole) so they survive release-please lockfile churn.
        # Restore only; CI's Build & Tests saves this key on main.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            target/**/build/lbug-*/out
            target/**/build/openssl-sys-*/out
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ steps.nativekey.outputs.key }}
          # A capacity witness must not restore unrelated older build shapes.
          # The warm validation explicitly refuses a miss instead of silently
          # becoming a second cold run. Main CI owns saving this native key.
          fail-on-cache-miss: ${{ inputs.cache_mode == 'warm' }}
      - name: Record coverage runner disk before instrumentation
        run: |
          echo "Coverage cache mode: $COVERAGE_CACHE_MODE" | tee -a "$GITHUB_STEP_SUMMARY"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh target 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Generate coverage
        # --workspace so coverage reflects the whole codebase, not just the root
        # package (see the Tests step note on the [package]+[workspace] manifest).
        run: cargo llvm-cov --workspace --features ci-direct-tests --no-fail-fast --lcov --output-path lcov.info -- --skip daemon_
        env:
          # Explicit, because this PR stops `CI`/`GITHUB_ACTIONS` from conferring
          # the bypass. An ambient variable set by dozens of unrelated tools must
          # not decide whether a database can have two writers; a job that wants
          # the escape hatch now says so.
          NESTWEAVER_ALLOW_NO_DAEMON: "1"
          NESTWEAVER_NO_DAEMON: "1"
      - name: Validate coverage artifact and bind capacity receipt
        env:
          NATIVE_KEY: native-${{ runner.os }}-${{ runner.arch }}-${{ steps.nativekey.outputs.key }}
          NATIVE_CACHE_HIT: ${{ steps.nativecache.outputs.cache-hit }}
          NATIVE_CACHE_MATCHED: ${{ steps.nativecache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test -s lcov.info
          lcov --summary lcov.info | tee coverage-summary.txt
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          coverage = pathlib.Path('lcov.info')
          digest = hashlib.sha256()
          with coverage.open('rb') as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                  digest.update(chunk)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['GITHUB_SHA'], 'coverage must bind the exact workflow SHA'
          mode = os.environ['COVERAGE_CACHE_MODE']
          hit = os.environ.get('NATIVE_CACHE_HIT') == 'true'
          if mode == 'warm':
              assert hit, 'warm capacity acceptance requires an exact restored native cache'
          if mode == 'cold':
              assert not hit, 'cold capacity acceptance must skip native restore'
          receipt = dict(sha=head, cache_mode=mode, native_cache_key=os.environ['NATIVE_KEY'],
                         native_cache_hit=hit, native_cache_matched=os.environ.get('NATIVE_CACHE_MATCHED'),
                         lcov_bytes=coverage.stat().st_size, lcov_sha256=digest.hexdigest())
          pathlib.Path('coverage-capacity.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Report coverage runner disk usage
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh target 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage-summary.txt
            coverage-capacity.json
          retention-days: 3

