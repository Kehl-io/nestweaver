name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  LBUG_BUILD_FROM_SOURCE: "1"
  CFLAGS: "-DZSTD_DISABLE_ASM"

jobs:
  # Detect what actually changed so we don't recompile the entire Rust
  # workspace (~50 min) for a frontend-only PR, or run the frontend/e2e
  # stack for a pure-Rust change. There are no branch-protection required
  # checks, so skipped jobs are safe — they don't deadlock merges.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'crates/nestweaver-web/frontend/**'

  fmt:
    name: Rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build-and-check:
    name: Build, Clippy & Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: build
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libzstd-dev pkg-config protobuf-compiler
      - name: Configure linker for lbug+tantivy zstd coexistence
        run: |
          mkdir -p .cargo
          printf '[target.x86_64-unknown-linux-gnu]\nrustflags = ["-C", "link-arg=-Wl,--allow-multiple-definition"]\n' > .cargo/config.toml
      - name: Build (triggers lbug prebuilt download on first run)
        run: |
          cargo build -p nestweaver-store 2>/dev/null || true
          sleep 2
          cargo build --tests
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        # --workspace is REQUIRED: the root manifest is both [package] and
        # [workspace], so `cargo test` without it runs ONLY the root package's
        # tests and silently skips every sub-crate's unit tests (engine, store,
        # federation, mcp, …) — where most of the logic lives.
        run: cargo test --workspace --no-fail-fast -- --skip daemon_
        env:
          NESTWEAVER_NO_DAEMON: "1"

  coverage:
    name: Coverage
    needs: changes
    # Coverage is informational (uploads an lcov artifact; nothing gates on it)
    # and is the single slowest job — a full *instrumented* recompile that can't
    # reuse the build job's cache. Run it only when landing on main, not on
    # every PR, so it's off the PR critical path.
    if: github.event_name == 'push' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: coverage
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libzstd-dev pkg-config protobuf-compiler
      - name: Configure linker for lbug+tantivy zstd coexistence
        run: |
          mkdir -p .cargo
          printf '[target.x86_64-unknown-linux-gnu]\nrustflags = ["-C", "link-arg=-Wl,--allow-multiple-definition"]\n' > .cargo/config.toml
      - name: Build (triggers lbug prebuilt download on first run)
        run: |
          cargo build -p nestweaver-store 2>/dev/null || true
          sleep 2
          cargo build --tests
      - name: Generate coverage
        # --workspace so coverage reflects the whole codebase, not just the root
        # package (see the Tests step note on the [package]+[workspace] manifest).
        run: cargo llvm-cov --workspace --no-fail-fast --lcov --output-path lcov.info -- --skip daemon_
        env:
          NESTWEAVER_NO_DAEMON: "1"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: lcov.info

  audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Prebuilt binary via install-action instead of `cargo install cargo-audit`
      # (which compiles it from source on every run, ~3 min).
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Run audit
        run: cargo audit || true

  e2e:
    name: E2E Tests
    needs: changes
    # E2E drives the real backend API + the frontend, so run it whenever either
    # side changes.
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      NESTWEAVER_NO_DAEMON: "1"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: build
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: crates/nestweaver-web/frontend/package-lock.json
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libzstd-dev pkg-config protobuf-compiler
      - name: Configure linker for lbug+tantivy zstd coexistence
        run: |
          mkdir -p .cargo
          printf '[target.x86_64-unknown-linux-gnu]\nrustflags = ["-C", "link-arg=-Wl,--allow-multiple-definition"]\n' > .cargo/config.toml
      - name: Install frontend dependencies
        working-directory: crates/nestweaver-web/frontend
        run: npm ci
      - name: Build (triggers lbug prebuilt download on first run)
        run: |
          cargo build -p nestweaver-store 2>/dev/null || true
          sleep 2
          cargo build
      - name: Index test data
        run: ./target/debug/nestweaver --no-daemon index --repo testdata/js --db /tmp/test.lbug
      - name: Install Playwright browsers
        working-directory: crates/nestweaver-web/frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: crates/nestweaver-web/frontend
        run: npx playwright test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: crates/nestweaver-web/frontend/playwright-report/
