        # cache instead of a test-owned tempdir. Runners are ephemeral, so
        # this only has to prove the directory did not exist before this
        # job's tests ran and does after — not survive across jobs/runs.
        run: |
          set -euo pipefail
          cache_dir="${XDG_CACHE_HOME:-$HOME/.cache}/nestweaver/models"
          if [ -d "$cache_dir" ]; then
            echo "NW_MODEL_CACHE_PREEXISTED=true" >> "$GITHUB_ENV"
          else
            echo "NW_MODEL_CACHE_PREEXISTED=false" >> "$GITHUB_ENV"
          fi
      - name: Daemon-named tests (skipped in the main job)
        env:
          NESTWEAVER_ALLOW_NO_DAEMON: "1"
        # The main job's `--skip daemon_` keeps these out of the flaky-prone
        # parallel run; they run here instead so daemon integration coverage
        # (authz boundary, migration self-heal, daemon proxy, …) is not lost.
        # The `daemon_` filter is the exact complement of the main job's skip.
        run: cargo test --locked --workspace --features ci-direct-tests --no-fail-fast -- daemon_
      - name: MCP daemon-feature tests
        # Check the standalone daemon-feature configuration separately from
        # workspace feature unification (which also enables embedding support).
        run: cargo test --locked -p nestweaver-mcp --features daemon --no-fail-fast
      - name: Verify no test reached the real model cache (nw-483)
        # Deliberately does not re-run any tests (that would double this job's
        # duration) — it only inspects the filesystem side effect the tests
        # above may have left. `if: always()` so a test FAILURE above still
        # gets this check; only a cancelled job skips it.
        if: always()
        run: |
          set -euo pipefail
          cache_dir="${XDG_CACHE_HOME:-$HOME/.cache}/nestweaver/models"
          if [ ! -d "$cache_dir" ]; then
            exit 0
          fi
          if [ "${NW_MODEL_CACHE_PREEXISTED:-false}" = "true" ]; then
            echo "::warning::$cache_dir exists, but it already existed before this job's tests ran, so this run cannot attribute it to a test (nw-483)."
            exit 0
          fi
          echo "::error::$cache_dir was created during this job's tests — a test reached the real platform model cache instead of an isolated tempdir (nw-483)."
          exit 1

  audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
      # Prebuilt binary via install-action instead of `cargo install cargo-audit`
      # (which compiles it from source on every run, ~3 min).
      - name: Install cargo-audit
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # cargo-audit 2026-09-02
        with:
          tool: cargo-audit
      # No `|| true`. This check is displayed as "Security Audit" on every pull
      # request in a public repo, which reads as an enforced supply-chain gate —
      # suppressing the exit code made that a false claim. Verified clean on
      # 2026-07-27: 834 dependencies, 0 vulnerabilities, 2 allowed warnings
      # (RUSTSEC-2024-0436 paste unmaintained, RUSTSEC-2026-0202 cxx unsound),
      # neither of which fails cargo-audit's default policy.
      #
      # When this does fail: triage the advisory, and if it must be accepted,
      # record it in audit.toml with a justification and a review date rather
      # than restoring a blanket suppression.
      - name: Run audit
        run: cargo audit

  secret-scan:
    name: Secret Scan
    # Deliberately NOT gated on needs.changes: a credential can be committed in
    # any file type, including ones no language filter matches.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Full history. This repo is public, so a secret that was committed and
          # later removed is still disclosed and still needs rotating — scanning
          # only the tip would miss exactly the case that matters most.
          fetch-depth: 0
      # Install the binary directly rather than gitleaks-action: the marketplace
      # action requires a GITLEAKS_LICENSE for organization-owned repos, which
      # would make this gate fail for reasons unrelated to the code.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          EXPECTED_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$EXPECTED_SHA256" /tmp/gitleaks.tar.gz | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Verify the config actually loads rules
        # A gitleaks config with no [extend] block and only an [allowlist]
        # silently loads zero detectors and reports "no leaks found" on
        # everything — this repo shipped exactly that config, unused, for
        # months. Prove the scanner is live before trusting a clean result.
        run: |
          set -euo pipefail
          mkdir -p /tmp/gl-probe
          # Assemble the probe token at runtime. Writing it as a literal would
          # commit a credential-shaped string into the repo, which this very
          # scanner then flags on every subsequent run. Split, neither half
          # matches a rule.
          PROBE_PREFIX='ghp_'
          PROBE_BODY='016C7B1D2E3F4a5b6c7d8e9f0A1B2C3D4E5F'
          printf 'token = "%s%s"\n' "$PROBE_PREFIX" "$PROBE_BODY" > /tmp/gl-probe/probe.txt
          if gitleaks detect --source /tmp/gl-probe --config .gitleaks.toml --no-git --redact; then
            echo "::error::gitleaks did not detect a planted credential — the config is not loading rules"
            exit 1
          fi
          echo "config verified: planted credential was detected"
      - name: Scan repository history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  npm-install-smoke:
    name: npm install smoke (macOS)
    needs: changes
    # `npm/**` is already in the `rust` filter above (it feeds the release
    # process), so this shares that gate rather than adding a new one.
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Real npm install of the wrapper package (nw-433 regression guard)
        # nw-433: `libc: ["glibc"]` in npm/package.json refused EVERY macOS
        # install with EBADPLATFORM ("Actual libc: undefined" -- libc is not a
        # concept on macOS). `os` and `cpu` matched; only `libc` failed, and
        # nothing in CI ever ran a real `npm install` on a macOS runner to
        # catch that before it reached a release. This job is that check.
        #
        # nw-425: the wrapper's `postinstall` (which downloaded a GitHub
        # Release archive) is retired. There is no lifecycle script left to
        # ignore, so this is now a genuinely full `npm install` -- the
        # optionalDependencies (nestweaver-darwin-arm64 etc., pinned to the
        # version already sitting in npm/package.json) do not exist on the
        # real registry until release-please's own PR bumps that version and
        # a release publishes them, so npm resolves them as ABSENT rather
        # than failing the install, which is exactly the "package manager
        # skipped optional dependencies" case bin/nestweaver's own error
        # message is written for. `npm pack` + `npm install <tarball>` (not
        # `npm install ./npm`) so this exercises the exact package.json npm
        # would publish, not the working-tree layout.
        #
        # No `--force` anywhere in this step -- that is the whole point: a
        # forced install is what let the original regression ship unnoticed.
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          (cd npm && npm pack --pack-destination "$pack_dir")
          tarball="$(ls "$pack_dir"/nestweaver-*.tgz)"
          install_dir="$(mktemp -d)"
          (
            cd "$install_dir"
            npm init -y >/dev/null
            npm install "$tarball"
          )
          echo "npm accepted the platform for $(uname -sm) without --force"
          launcher_output="$(node "$install_dir/node_modules/nestweaver/bin/nestweaver" --version 2>&1 || true)"
          # BOTH outcomes below are correct, and which one occurs is decided by
          # something outside this PR: whether the version pinned in
          # npm/package.json has been PUBLISHED yet.
          #
          # This assertion used to accept only the first. That held while the
          # pinned version was always unreleased, but it inverts the moment a
          # release publishes -- `nestweaver-darwin-arm64@<pinned>` then
          # resolves, npm installs it, and the launcher runs for real. The job
          # is skipped unless the `rust` filter trips, so after 9.2.0 shipped
          # this sat latent on main and failed on the next PR to touch a
          # filtered path, reporting a defect in the PR for a state the PR did
          # not create -- a gate that is wrong about correct work, the same
          # class as the three defects in the 9.2.0 release incident.
          #
          # What this job actually guards (nw-433) is the line above: a real
          # `npm install` on macOS arm64 succeeding WITHOUT `--force`. That is
          # what EBADPLATFORM broke and what no other job covers. The launcher
          # check is downstream of it, so it must accept either honest result
          # and reject only genuine breakage.
          if grep -q 'optional dependency' <<< "$launcher_output"; then
            echo "bin/nestweaver correctly reports the missing (not-yet-published) platform package"
          elif grep -Eq '^nestweaver [0-9]+\.[0-9]+\.[0-9]+' <<< "$launcher_output"; then
            echo "the pinned platform package is published; the installed launcher ran it: $launcher_output"
          else
            echo "::error::launcher neither reported a missing optional dependency nor ran, got:" >&2
            echo "$launcher_output" >&2
            exit 1
          fi

  e2e:
    name: E2E Tests
    # See the daemon-tests timeout-minutes comment for why these bounds exist.
    timeout-minutes: 120
    needs: changes
    # E2E drives the real backend API + the frontend, so run it whenever either
    # side changes.
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      # Match the test/build cache profile instead of creating another namespace.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
      - name: Check out the pinned LadybugDB source
        # Sets LBUG_SOURCE_DIR for the lbug build. The tag and commit live
        # in scripts/fetch-lbug-source.sh only.
        run: scripts/fetch-lbug-source.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Restore the complete Build & Tests cache; consumers never publish it.
          save-if: false
          shared-key: build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: crates/nestweaver-web/frontend/package-lock.json
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libzstd-dev pkg-config protobuf-compiler mold
      - name: Install frontend dependencies
        working-directory: crates/nestweaver-web/frontend
        run: npm ci
      - name: Compute native dependency cache key
        id: nativekey
        run: |
          LBUG_VER=$(awk '/^name = "lbug"$/{getline; print $3}' Cargo.lock | tr -d '"')
          OSSL_VER=$(awk '/^name = "openssl-sys"$/{getline; print $3}' Cargo.lock | tr -d '"')
          RUSTC_VER=$(rustc --version | awk '{print $2}')
          echo "key=${LBUG_VER}-${OSSL_VER}-rustc${RUSTC_VER}" >> "$GITHUB_OUTPUT"
      - name: Cache native build outputs (lbug C++, OpenSSL)
        # lbug (C++ graph DB, built from source) and vendored OpenSSL dominate
        # cold-build time. Keyed on their package versions (not Cargo.lock as a
        # whole) so they survive release-please lockfile churn. Restore only:
        # Build & Tests saves it on main, so branches never evict main's copy.
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            target/**/build/lbug-*/out
            target/**/build/openssl-sys-*/out
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ steps.nativekey.outputs.key }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-
      - name: Build frontend for standard browser acceptance
        working-directory: crates/nestweaver-web/frontend
        run: npm run build
      - name: Build standard daemon and embedded UI
        run: cargo build --locked
      - name: Install Playwright browsers
        working-directory: crates/nestweaver-web/frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: crates/nestweaver-web/frontend
        run: |
          browser_executable=$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')
          python3 ../../../tests/support/release_ui.py \
            --binary ../../../target/debug/nestweaver \
            --node "$(command -v node)" \
            --browser "$browser_executable"
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            /tmp/nw-release-*/browser-results/
            /tmp/nw-release-*/browser.log
            /tmp/nw-release-*/ui.log
            /tmp/nw-release-*/daemon.log
            /tmp/nw-release-*/evidence.jsonl

  required-ci:
    name: Required CI
    # `always()` is essential: a failed, cancelled, or unexpectedly skipped
    # prerequisite must be reduced to a failing conclusion, not skip the one
    # check the main-branch ruleset requires.
    if: always()
    needs:
      - changes
      - metal-smoke
      - fmt
      - build-and-check
      - clippy
      - daemon-tests
      - standard-daemon
      - audit
      - secret-scan
      - npm-install-smoke
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact SHA and reduce required results
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Required CI checked out $ACTUAL_SHA, expected $EXPECTED_SHA" >&2
            exit 1
          fi

          bash scripts/verify-required-ci.sh --self-test
          bash scripts/verify-main-rules.sh --ruleset .github/main-ruleset.json
          bash scripts/verify-main-rules.sh --self-test
          python3 scripts/test-verify-release-fault.py
          python3 scripts/test-release-publication-gates.py
          python3 scripts/test-mutation-canary.py
          python3 scripts/test-changelog-upload.py
          python3 scripts/test-release-pr-locator.py
          python3 scripts/test-release-lockfile-publication.py
          python3 -m unittest discover -s tests/support -p test_isolated_daemon.py -v
          python3 -m unittest discover -s tests/support -p test_release_publication_failure.py -v
          python3 scripts/verify-ci-runtime-contracts.py
          node npm/nestweaver.test.js
          bash scripts/dedupe-changelog-entries.sh --self-test
          bash scripts/verify-release-bundle.sh --self-test
          bash scripts/verify-release-package.sh --self-test
          bash -n scripts/observe-release-visibility.sh \
            scripts/verify-release-canary-pr.sh
          uses_key=uses
          at_sign=@
          # Strip trailing comments BEFORE testing the pin. The old check
          # required the 40-hex to follow an `@`, but accepted it ANYWHERE on
          # the line -- so `uses: evil/action@v1  # see actions/checkout@<sha>`
          # passed on the hash in its own comment. Trailing whitespace after a
          # valid pin is still a pin, and indented comment-only lines collapse
          # to empty and are dropped rather than reported as unpinned.
          unpinned_actions="$({
            grep -REn "${uses_key}:[[:space:]]+[^[:space:]]+${at_sign}" \
              .github/workflows || true
          } | sed -E 's/[[:space:]]+#.*$//' \
            | grep -Ev "${at_sign}[0-9a-f]{40}[[:space:]]*$" \
            | grep -Ev ':[0-9]+:[[:space:]]*$' || true)"
          if [ -n "$unpinned_actions" ]; then
            echo "::error::every external action must be pinned to a full commit SHA" >&2
            printf '%s\n' "$unpinned_actions" >&2
            exit 1
          fi
          printf '%s\n' "$NEEDS_JSON" | bash scripts/verify-required-ci.sh -
          {
            echo "Required non-advisory CI passed."
            echo ""
            echo "Exact candidate SHA: \`$ACTUAL_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate GitHub Actions workflow syntax
        if: always()
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          tool_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$tool_dir"
          curl --fail-with-body --silent --show-error --location \
            --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" .github/workflows/*.yml
