    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # Shared CI runners are slower than a dev box; give the test server
      # startup deadline (tests/helpers/server_guard.rs) extra headroom.
