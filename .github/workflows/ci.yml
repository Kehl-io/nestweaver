name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]
  # A PR created with the repository GITHUB_TOKEN may not emit a pull_request
  # workflow event at all. Maintainers can explicitly run CI from that PR's
  # latest branch head; the Required CI check remains bound to github.sha.
  #
  # TRUST BOUNDARY, recorded so it is not re-derived: workflow_dispatch reads
  # this file from the SELECTED REF, so a dispatch against a branch runs that
  # branch's definition of `Required CI`. That is not a widening -- the
  # `pull_request` trigger above already runs the workflow from the PR's merge
  # ref, so any PR that edits this file already runs its own edited copy. The
  # control for both is the same and is NOT this trigger: CODEOWNERS requires
  # maintainer review on `.github/workflows/**`, and branch protection requires
  # that review before merge. Dispatch additionally requires repository write
  # access, which already permits strictly more.
  workflow_dispatch:

permissions:
  contents: read

# Cancel a PR's earlier run when a new commit supersedes it.
#
# There was no concurrency group at all, so every push to a branch left its
# previous run going: a full matrix — Build & Tests ~1h, Daemon Integration
# ~55m, E2E ~50m, Cold Metal ~43m, mutants ~45m — computing an answer about
# a commit nobody would look at again. With one shared runner pool that is not
# just waste, it is HEAD-OF-LINE BLOCKING: those obsolete jobs sit in front of
# every other PR's real work, which is why runs queued for over an hour while
# several PRs were open.
#
# `cancel-in-progress` is deliberately scoped to pull_request. A push to main
# must NEVER be cancelled — release-please and the publish flow run there, and
# cancelling one mid-flight would leave a release half-cut.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  LBUG_BUILD_FROM_SOURCE: "1"
  CFLAGS: "-DZSTD_DISABLE_ASM"
  # mold, purely for link speed. Set as an env override rather than appended to
  # .cargo/config.toml: a second [target.x86_64-unknown-linux-gnu] table is a
  # TOML duplicate key and fails the build outright. No duplicate-symbol
  # suppression belongs here — exactly one copy of zstd is linked, so nothing
  # needs tolerating. See .cargo/config.toml.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  # Detect what actually changed so we don't recompile the entire Rust
  # workspace (~50 min) for a frontend-only PR, or run the frontend/e2e
  # stack for a pure-Rust change. Branch protection requires only the stable
  # `Required CI` aggregate below; that job interprets these conditional skips
  # instead of asking GitHub to require job names that may not be created.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      metal: ${{ steps.filter.outputs.metal }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-please.yml'
              - '.github/CODEOWNERS'
              - 'CONTRIBUTING.md'
              - 'release-please-config.json'
              - 'scripts/observe-release-visibility.sh'
              - 'scripts/verify-release-canary-pr.sh'
              - 'scripts/verify-release-bundle.sh'
              - 'scripts/verify-release-package.sh'
              - 'scripts/verify-required-ci.sh'
              - 'examples/**'
              - 'instance.toml'
              - 'INSTALL.md'
              - 'README.md'
              - 'CLAUDE.md'
              - 'docs/**'
              - 'npm/**'
              - 'smithery.yaml'
            metal:
              - 'crates/nestweaver-embed/**'
              - 'crates/nestweaver-daemon/src/lifecycle.rs'
              - 'crates/nestweaver-daemon/src/launchd.rs'
              - 'crates/nestweaver-daemon/src/server.rs'
              - 'crates/nestweaver-daemon/Cargo.toml'
              - 'crates/nestweaver-client/src/autostart.rs'
              - 'src/main.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-please.yml'
              - 'tests/metal_smoke.rs'
            frontend:
              - 'crates/nestweaver-web/frontend/**'

  metal-smoke:
    name: Cold Metal daemon smoke
    needs: changes
    if: needs.changes.outputs.metal == 'true'
    runs-on: macos-latest
    # 60 did not fit a COLD cache. Measured on the run that failed: 36m14s to
    # build the release binary, then 5m51s + 12m51s of release test gates, and
    # the wall hit during the fourth step — so the job died having reached NONE
    # of the Metal smoke steps it exists for, and reported that as a Metal
    # failure.
    #
    # It was also self-perpetuating: dying with rustc still writing target/
    # made rust-cache's save step fail with "file changed as we read it", so
    # nothing was cached and the next run was cold too. Two PRs failed this way
    # back to back. The budget has to cover a cold build, not just a warm one.
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.3"
      NESTWEAVER_METAL_SMOKE_MODEL_ID: sentence-transformers/all-MiniLM-L6-v2
    steps:
      - name: Verify native Apple Silicon runner
        shell: bash
        run: test "$(uname -m)" = "arm64"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          shared-key: metal-smoke
      - name: Install build dependencies
        run: brew install protobuf
      - name: Build Metal-enabled CLI
        run: cargo build --locked --release --features metal
      # `--features metal`, NOT `--features embed`. `metal` is additive on top
      # of `default = ["embed"]`, so this step was verifying the daemon's
      # cache-only contract under a DIFFERENT feature set than the binary the
      # smoke steps below actually run — the one place in this job where that
      # contract is checked, checked against an artifact that does not ship.
      # The same applies to the two gates after it. Aligning them is about
      # testing the shipped configuration; it is not a speed fix, and the
      # timeout above is what addresses the duration.
      - name: Verify daemon cache-only contract
        run: |
          cargo test --locked --release -p nestweaver-daemon --features metal \
            daemon_embedding_startup_constructs_cached_model_offline
      # nw-194: this job used to run ONLY the one named test above, so every
      # macOS-specific failure was invisible to CI while being the first thing a
      # developer on the project's primary platform hit. Eleven were accumulating
      # in nestweaver-daemon and four more in nestweaver-mcp, all from the same
      # small set of portability assumptions (/bin/true, $XDG_STATE_HOME,
      # non-UTF-8 filenames, Linux pid reuse).
      #
      # Scoped to the WORKSPACE, not just the daemon: the class recurred in a
      # second crate precisely because the gate was per-crate. --lib keeps this
      # to unit tests; the ubuntu job still carries integration coverage.
      # nw-205: --no-fail-fast. Without it a failure in one crate ABORTS the
      # remaining crates, and the job reports a single non-zero exit that reads
      # like a verdict on the whole workspace while later crates were never run
      # at all. That is how a daemon-crate flake hid the store and engine
      # suites entirely. Every other test job here already passes it.
      - name: Workspace unit tests (macOS portability gate)
        run: cargo test --locked --release --features metal --workspace --lib --no-fail-fast
      # The --lib gate above did not cover INTEGRATION tests, and two of them
      # were failing on macOS the whole time: one #[cfg(target_os = "macos")]
      # test Linux CI can never run, and one gc test that passes on Linux but
      # diverges on macOS. Both are fixed; this keeps them fixed.
      - name: Daemon integration tests (macOS portability gate)
        run: cargo test --locked --release --features metal --test daemon_test
      # nw-222: the ONE artifact that would identify the recurring SIGSEGV.
      #
      # A test binary has died with `signal: 11` on ~15% of runs of this job,
      # including on a PR that changed zero Rust. Every occurrence has been
      # diagnosed from cargo's one-line summary, which names the binary and
      # nothing else — not the faulting thread, not a symbolized frame, not the
      # fault address. macOS writes all of that to a `.ips` in
      # DiagnosticReports, and we have simply never collected it.
      #
      # `if: failure()` so it costs nothing on a green run, and
      # `continue-on-error` so a missing report directory can never turn a real
      # failure into a confusing second one.
      - name: Collect macOS crash reports
        # No `continue-on-error`: a contract test asserts this job carries none,
        # because the Metal smoke is a required gate and not an informational
        # one. The guard cannot distinguish a step-level flag from a job-level
        # one, and weakening it to accommodate a diagnostic step would trade a
        # real invariant for convenience. It is not needed anyway — this runs
        # only when the job has ALREADY failed, so a failure here cannot change
        # the outcome, and the script tolerates a missing directory itself.
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          dest="$RUNNER_TEMP/crash-reports"
          mkdir -p "$dest"
          for dir in "$HOME/Library/Logs/DiagnosticReports" \
                     "$HOME/Library/Logs/DiagnosticReports/Retired" \
                     "/Library/Logs/DiagnosticReports"; do
            [ -d "$dir" ] || continue
            # Only ours. A runner image ships unrelated reports, and a folder
            # of noise is how a useful artifact gets ignored.
            find "$dir" -maxdepth 1 -type f \( -name 'nestweaver*' -o -name 'cargo*' \
              -o -name 'lbug*' -o -name '*nestweaver*' \) -exec cp {} "$dest/" \; 2>/dev/null || true
          done
          count=$(find "$dest" -type f | wc -l | tr -d ' ')
          echo "collected $count crash report(s)"
          # Surface the decisive lines in the log itself, so a reader does not
          # have to download an artifact to learn whether this was the SIGSEGV.
          for report in "$dest"/*; do
            [ -f "$report" ] || continue
            echo "── $(basename "$report") ──"
            head -c 4000 "$report"
            echo
          done
      - name: Upload macOS crash reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-crash-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crash-reports
          if-no-files-found: ignore
          retention-days: 14
      - name: Configure isolated smoke paths
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          TARGET_ROOT="$HOME/Library/Caches/io.kehl.nestweaver-metal-smoke/$SMOKE_KEY"
          SETUP_ROOT="$RUNNER_TEMP/nestweaver-metal-cache-$SMOKE_KEY"
          TARGET_DB="$TARGET_ROOT/brain.lbug"
          TARGET_CONFIG="$TARGET_ROOT/instance.toml"
          SETUP_DB="$SETUP_ROOT/cache-seed.lbug"
          MODEL_CACHE="$SETUP_ROOT/model-cache"
          OUTPUT_DIR="$RUNNER_TEMP/nestweaver-metal-evidence-$SMOKE_KEY"
          mkdir -p "$TARGET_ROOT" "$SETUP_ROOT"
          CANONICAL_DB="$(cd "$TARGET_ROOT" && pwd -P)/brain.lbug"
          INSTANCE_ID="$(printf '%s' "$CANONICAL_DB" | shasum -a 256 | cut -c1-8)"
          RUNTIME_DIR="$HOME/.local/state/nestweaver/$INSTANCE_ID"
          {
            echo "TARGET_ROOT=$TARGET_ROOT"
            echo "SETUP_ROOT=$SETUP_ROOT"
            echo "TARGET_DB=$TARGET_DB"
            echo "TARGET_CONFIG=$TARGET_CONFIG"
            echo "SETUP_DB=$SETUP_DB"
            echo "MODEL_CACHE=$MODEL_CACHE"
            echo "OUTPUT_DIR=$OUTPUT_DIR"
            echo "INSTANCE_ID=$INSTANCE_ID"
            echo "RUNTIME_DIR=$RUNTIME_DIR"
            echo "PLIST_PATH=$HOME/Library/LaunchAgents/io.kehl.nestweaver.$INSTANCE_ID.plist"
            echo "NESTWEAVER_METAL_SMOKE_DB=$TARGET_DB"
            echo "NESTWEAVER_METAL_SMOKE_OUTPUT_DIR=$OUTPUT_DIR"
            echo "NESTWEAVER_METAL_SMOKE_CACHE_DIR=$MODEL_CACHE"
          } >> "$GITHUB_ENV"
      - name: Populate model cache on CPU
        shell: bash
        env:
          # THE failure this fixes. Without it, `--no-daemon` was ignored, the
          # index step autostarted a daemon against the seed DB, that daemon took
          # the write lease, and the embed step below refused — correctly — to
          # become a second writer. Two commands, one intended to be isolated,
          # silently disagreeing about whether a daemon was in play.
          NESTWEAVER_ALLOW_NO_DAEMON: "1"
        run: |
          set -euo pipefail
          BIN="$PWD/target/release/nestweaver"
          "$BIN" --no-daemon --no-embed index \
            --repo testdata/js --db "$SETUP_DB"
          "$BIN" --no-daemon embed --local --accelerator cpu \
            --cache-dir "$MODEL_CACHE" --db "$SETUP_DB" \
            --scope symbols --force
          find "$MODEL_CACHE" -type f -print0 |
            sort -z |
            xargs -0 shasum -a 256 > "$SETUP_ROOT/cache-before.sha256"
          chmod -R a-w "$MODEL_CACHE"
      - name: Assert clean daemon preconditions
        run: |
          cargo test --locked --release --features metal --test metal_smoke \
            apple_hardware::cold_daemon_preconditions_are_clean \
            -- --ignored --exact --nocapture
      - name: Write explicit Metal instance config
        shell: bash
        run: |
          {
            printf 'instance_id = "metal-smoke"\n\n'
            printf '[snapshot_storage]\nbackend = "local"\npath = "%s/snapshots"\n\n' "$TARGET_ROOT"
            printf '[workspace]\nbackend = "local"\npath = "%s/workspace"\n\n' "$TARGET_ROOT"
            printf '[inference]\nendpoint = "http://127.0.0.1:9"\n'
            printf 'embedding_model = "unused"\nsummary_model = "unused"\n\n'
            printf '[embedding]\nmodel_id = "%s"\n' "$NESTWEAVER_METAL_SMOKE_MODEL_ID"
            printf 'accelerator = "metal"\ncache_dir = "%s"\n\n' "$MODEL_CACHE"
            printf '[git]\ncredential_method = "gh"\n'
          } > "$TARGET_CONFIG"
          ./target/release/nestweaver config validate "$TARGET_CONFIG"
      - name: Cold Metal daemon inference
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/target/release/nestweaver"
          mkdir -p "$OUTPUT_DIR"
          "$BIN" index --repo testdata/js --db "$TARGET_DB" --config "$TARGET_CONFIG" \
            >"$OUTPUT_DIR/cold-index.stdout" 2>"$OUTPUT_DIR/cold-index.stderr"

          ready=false
          for _ in $(seq 1 60); do
            if "$BIN" brain status --db "$TARGET_DB" --config "$TARGET_CONFIG" --json \
              >"$OUTPUT_DIR/cold-status.json" 2>"$OUTPUT_DIR/cold-status.stderr" &&
              jq -e '
                .embedding_status.state == "ready" and
                .embedding_status.requested_device == "metal" and
                .embedding_status.selected_device == "metal" and
                .embedding_status.fallback_used == false
              ' "$OUTPUT_DIR/cold-status.json" >/dev/null; then
              ready=true
              break
            fi
            if jq -e '.embedding_status.state == "failed"' \
              "$OUTPUT_DIR/cold-status.json" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          test "$ready" = true
          test -f "$PLIST_PATH"
          launchctl print "gui/$(id -u)/io.kehl.nestweaver.$INSTANCE_ID" \
            >"$OUTPUT_DIR/cold-launchd.txt"
          "$BIN" embed --db "$TARGET_DB" --scope symbols --force --stats \
            >"$OUTPUT_DIR/cold-embed.stdout" 2>"$OUTPUT_DIR/cold-embed.stderr"
          grep -q "Embedding via daemon" "$OUTPUT_DIR/cold-embed.stderr"
      - name: Restart and repeat warm Metal inference
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/target/release/nestweaver"
          "$BIN" daemon --db "$TARGET_DB" stop \
            >"$OUTPUT_DIR/stop.stdout" 2>"$OUTPUT_DIR/stop.stderr"

          ready=false
          for _ in $(seq 1 60); do
            if "$BIN" brain status --db "$TARGET_DB" --config "$TARGET_CONFIG" --json \
              >"$OUTPUT_DIR/warm-status.json" 2>"$OUTPUT_DIR/warm-status.stderr" &&
              jq -e '
                .embedding_status.state == "ready" and
                .embedding_status.requested_device == "metal" and
                .embedding_status.selected_device == "metal" and
                .embedding_status.fallback_used == false
              ' "$OUTPUT_DIR/warm-status.json" >/dev/null; then
              ready=true
              break
            fi
            if jq -e '.embedding_status.state == "failed"' \
              "$OUTPUT_DIR/warm-status.json" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          test "$ready" = true
          test -f "$PLIST_PATH"
          launchctl print "gui/$(id -u)/io.kehl.nestweaver.$INSTANCE_ID" \
            >"$OUTPUT_DIR/warm-launchd.txt"
          "$BIN" embed --db "$TARGET_DB" --scope symbols --force --stats \
            >"$OUTPUT_DIR/warm-embed.stdout" 2>"$OUTPUT_DIR/warm-embed.stderr"
          grep -q "Embedding via daemon" "$OUTPUT_DIR/warm-embed.stderr"
      - name: Verify cache-only Metal vector
        run: |
          cargo test --locked --release --features metal --test metal_smoke \
            apple_hardware::metal_embedding_is_finite_normalized_and_uses_metal \
            -- --ignored --exact --nocapture
          find "$MODEL_CACHE" -type f -print0 |
            sort -z |
            xargs -0 shasum -a 256 > "$SETUP_ROOT/cache-after.sha256"
          diff -u "$SETUP_ROOT/cache-before.sha256" "$SETUP_ROOT/cache-after.sha256"
      - name: Collect Metal smoke evidence
        if: failure()
        shell: bash
        run: |
          OUTPUT_DIR="${OUTPUT_DIR:-$RUNNER_TEMP/nestweaver-metal-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}}"
          mkdir -p "$OUTPUT_DIR"
          BIN="$PWD/target/release/nestweaver"
          "$BIN" diagnostics capabilities --json \
            >"$OUTPUT_DIR/capabilities.json" 2>"$OUTPUT_DIR/capabilities.stderr" || true
          if [ -n "${TARGET_DB:-}" ]; then
            "$BIN" daemon --db "$TARGET_DB" status \
              >"$OUTPUT_DIR/daemon-status.txt" 2>"$OUTPUT_DIR/daemon-status.stderr" || true
          fi
          if [ -n "${RUNTIME_DIR:-}" ] && [ -f "$RUNTIME_DIR/daemon.log" ]; then
            cp "$RUNTIME_DIR/daemon.log" "$OUTPUT_DIR/daemon.log"
          fi
          if [ -n "${INSTANCE_ID:-}" ]; then
            launchctl print "gui/$(id -u)/io.kehl.nestweaver.$INSTANCE_ID" \
              >"$OUTPUT_DIR/launchd.txt" 2>&1 || true
          fi
      - name: Upload Metal smoke evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: metal-smoke-evidence
          path: ${{ runner.temp }}/nestweaver-metal-evidence-${{ github.run_id }}-${{ github.run_attempt }}-metal-smoke
          if-no-files-found: error
      - name: Clean up isolated Metal daemon
        if: always()
        shell: bash
        run: |
          daemon_stopped=false
          if [ -n "${TARGET_DB:-}" ] && [ -x target/release/nestweaver ]; then
            if target/release/nestweaver daemon --db "$TARGET_DB" stop; then
              daemon_stopped=true
            fi
          fi
          if [ "$daemon_stopped" = true ] &&
            [ -n "${INSTANCE_ID:-}" ] &&
            [ "${RUNTIME_DIR:-}" = "$HOME/.local/state/nestweaver/$INSTANCE_ID" ]; then
            case "$RUNTIME_DIR" in
              "$HOME/.local/state/nestweaver/"?*) rm -rf -- "$RUNTIME_DIR" ;;
            esac
          fi
          if [ -n "${MODEL_CACHE:-}" ] && [ -d "$MODEL_CACHE" ]; then
            chmod -R u+w "$MODEL_CACHE" || true
          fi
          case "${TARGET_ROOT:-}" in
            "$HOME/Library/Caches/io.kehl.nestweaver-metal-smoke/"*)
              rm -rf -- "$TARGET_ROOT"
              ;;
          esac
          case "${SETUP_ROOT:-}" in
            "$RUNNER_TEMP/nestweaver-metal-cache-"*) rm -rf -- "$SETUP_ROOT" ;;
          esac
          case "${OUTPUT_DIR:-}" in
            "$RUNNER_TEMP/nestweaver-metal-evidence-"*) rm -rf -- "$OUTPUT_DIR" ;;
          esac

  fmt:
    name: Rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build-and-check:
    name: Build & Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # Test binaries with full debug info exhaust the GitHub-hosted runner's
      # disk once the entire workspace is compiled. Backtraces still retain
      # symbol names while keeping target/ small enough for the full suite.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          shared-key: build
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libzstd-dev pkg-config protobuf-compiler mold
      - name: Compute native dependency cache key
        id: nativekey
        run: |
          LBUG_VER=$(awk '/^name = "lbug"$/{getline; print $3}' Cargo.lock | tr -d '"')
          OSSL_VER=$(awk '/^name = "openssl-sys"$/{getline; print $3}' Cargo.lock | tr -d '"')
          RUSTC_VER=$(rustc --version | awk '{print $2}')
          echo "key=${LBUG_VER}-${OSSL_VER}-rustc${RUSTC_VER}" >> "$GITHUB_OUTPUT"
      - name: Cache native build outputs (lbug C++, OpenSSL)
        # lbug (C++ graph DB, built from source) and vendored OpenSSL dominate
        # cold-build time. Keyed on their package versions (not Cargo.lock as a
        # whole) so they survive release-please lockfile churn.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            target/**/build/lbug-*/out
            target/**/build/openssl-sys-*/out
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ steps.nativekey.outputs.key }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate lockfile and warm native dependencies
        run: |
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo build --locked -p nestweaver-store 2>/dev/null || true
          sleep 2
      - name: Build CLI
        run: cargo build --locked
      - name: Validate canonical instance config
        run: cargo run --locked -- config validate examples/minimal-instance.toml
      - name: Type-check benchmarks
        # Bench targets are built by neither `cargo build` nor `cargo test`, so
        # nothing here compiled them until this step existed and they rotted
        # unnoticed. `check --benches` catches a bench that stops compiling
        # without paying for a full release-profile `bench --no-run`.
        run: cargo check --locked --benches
      - name: Tests
        # --workspace is REQUIRED: the root manifest is both [package] and
        # [workspace], so `cargo test` without it runs ONLY the root package's
        # tests and silently skips every sub-crate's unit tests (engine, store,
        # federation, mcp, …) — where most of the logic lives.
        run: cargo test --locked --workspace --no-fail-fast -- --skip daemon_
        env:
          # Explicit, because this PR stops `CI`/`GITHUB_ACTIONS` from conferring
          # the bypass. An ambient variable set by dozens of unrelated tools must
          # not decide whether a database can have two writers; a job that wants
          # the escape hatch now says so.
          NESTWEAVER_ALLOW_NO_DAEMON: "1"
          NESTWEAVER_NO_DAEMON: "1"

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          shared-key: build
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libzstd-dev pkg-config protobuf-compiler mold
      - name: Compute native dependency cache key
        id: nativekey
        run: |
          LBUG_VER=$(awk '/^name = "lbug"$/{getline; print $3}' Cargo.lock | tr -d '"')
          OSSL_VER=$(awk '/^name = "openssl-sys"$/{getline; print $3}' Cargo.lock | tr -d '"')
          RUSTC_VER=$(rustc --version | awk '{print $2}')
          echo "key=${LBUG_VER}-${OSSL_VER}-rustc${RUSTC_VER}" >> "$GITHUB_OUTPUT"
      - name: Cache native build outputs (lbug C++, OpenSSL)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            target/**/build/lbug-*/out
            target/**/build/openssl-sys-*/out
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ steps.nativekey.outputs.key }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-
      # Parallel with Build & Tests: when the shared rust cache is warm this
      # finishes in minutes instead of adding ~20 min serial to the build job.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  daemon-tests:
    name: Daemon Integration Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # Shared CI runners are slower than a dev box; give the test server
      # startup deadline (tests/helpers/server_guard.rs) extra headroom.
      NESTWEAVER_TEST_SERVER_TIMEOUT_SECS: "60"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          shared-key: build
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libzstd-dev pkg-config protobuf-compiler mold
      - name: Compute native dependency cache key
        id: nativekey
        run: |
          LBUG_VER=$(awk '/^name = "lbug"$/{getline; print $3}' Cargo.lock | tr -d '"')
          OSSL_VER=$(awk '/^name = "openssl-sys"$/{getline; print $3}' Cargo.lock | tr -d '"')
          RUSTC_VER=$(rustc --version | awk '{print $2}')
          echo "key=${LBUG_VER}-${OSSL_VER}-rustc${RUSTC_VER}" >> "$GITHUB_OUTPUT"
      - name: Cache native build outputs (lbug C++, OpenSSL)
        # lbug (C++ graph DB, built from source) and vendored OpenSSL dominate
        # cold-build time. Keyed on their package versions (not Cargo.lock as a
        # whole) so they survive release-please lockfile churn.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            target/**/build/lbug-*/out
            target/**/build/openssl-sys-*/out
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ steps.nativekey.outputs.key }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate lockfile and warm native dependencies
        run: |
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo build --locked -p nestweaver-store 2>/dev/null || true
          sleep 2
      - name: Daemon-named tests (skipped in the main job)
        # The main job's `--skip daemon_` keeps these out of the flaky-prone
        # parallel run; they run here instead so daemon integration coverage
        # (authz boundary, migration self-heal, daemon proxy, …) is not lost.
        # The `daemon_` filter is the exact complement of the main job's skip.
        run: cargo test --locked --workspace --no-fail-fast -- daemon_
      - name: MCP daemon-feature tests
        # `cargo test --workspace` builds nestweaver-mcp without its optional
        # `daemon` feature, so these tests never run in the main job.
        run: cargo test --locked -p nestweaver-mcp --features daemon --no-fail-fast

  coverage:
    name: Coverage
    needs: changes
    # Coverage is informational (uploads an lcov artifact; nothing gates on it)
    # and is the single slowest job — a full *instrumented* recompile that can't
    # reuse the build job's cache. Run it only when landing on main, not on
    # every PR, so it's off the PR critical path.
    if: github.event_name == 'push' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          key: coverage
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@2af88edc33c2d5ff8a473fd1c5ab83052f77afee # cargo-llvm-cov 2026-09-02
        with:
          tool: cargo-llvm-cov
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libzstd-dev pkg-config protobuf-compiler mold
      - name: Compute native dependency cache key
        id: nativekey
        run: |
          LBUG_VER=$(awk '/^name = "lbug"$/{getline; print $3}' Cargo.lock | tr -d '"')
          OSSL_VER=$(awk '/^name = "openssl-sys"$/{getline; print $3}' Cargo.lock | tr -d '"')
          RUSTC_VER=$(rustc --version | awk '{print $2}')
          echo "key=${LBUG_VER}-${OSSL_VER}-rustc${RUSTC_VER}" >> "$GITHUB_OUTPUT"
      - name: Cache native build outputs (lbug C++, OpenSSL)
        # lbug (C++ graph DB, built from source) and vendored OpenSSL dominate
        # cold-build time. Keyed on their package versions (not Cargo.lock as a
        # whole) so they survive release-please lockfile churn.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            target/**/build/lbug-*/out
            target/**/build/openssl-sys-*/out
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ steps.nativekey.outputs.key }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-
      - name: Build (triggers lbug prebuilt download on first run)
        # --locked: fail the PR (not the release build) when Cargo.lock drifts
        # out of sync with the manifests.
        run: |
          cargo build --locked -p nestweaver-store 2>/dev/null || true
          sleep 2
          cargo build --locked --tests
      - name: Generate coverage
        # --workspace so coverage reflects the whole codebase, not just the root
        # package (see the Tests step note on the [package]+[workspace] manifest).
        run: cargo llvm-cov --workspace --no-fail-fast --lcov --output-path lcov.info -- --skip daemon_
        env:
          # Explicit, because this PR stops `CI`/`GITHUB_ACTIONS` from conferring
          # the bypass. An ambient variable set by dozens of unrelated tools must
          # not decide whether a database can have two writers; a job that wants
          # the escape hatch now says so.
          NESTWEAVER_ALLOW_NO_DAEMON: "1"
          NESTWEAVER_NO_DAEMON: "1"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: lcov.info

  mutants:
    name: Mutation testing (advisory)
    needs: changes
    # ADVISORY ONLY — nothing gates on this, and there is deliberately no
    # mutation-score threshold.
    #
    # A score target invites tests written to kill mutants rather than to check
    # behaviour (Goodhart). Google's deployment reports surface individual
    # SURVIVING mutants on the diff under review and never show developers a
    # score; that is the model here.
    #
    # Why it exists: the post-7.0.0 review found ~20 tests that pass with the
    # fix they guard reverted — several guarding named tickets, so they read as
    # coverage while guarding nothing. Coverage cannot see that class; mutant
    # detection correlates with real fault detection INDEPENDENTLY of coverage
    # (Just et al., FSE 2014).
    #
    # `--in-diff` keeps it to the PR's own changes, which is what makes the
    # runtime tolerable — a full baseline is a separate, occasional run.
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    # Backstop only. The mutation run bounds itself with `timeout` (see the
    # "Mutate only what this PR changed" step) so that the reporting steps
    # still run and can DISCLOSE a truncated run. This job-level limit exists
    # for everything the wrapper can't cover — a wedged apt/cargo install, a
    # hung cache restore. Cancelling the job here skips the disclosure, so it
    # is set well above the mutation budget and should never be what fires.
    #
    # Nothing bounded total runtime before: `--timeout` is PER CARGO COMMAND,
    # not per job. On PR #319 this job ran 2h04m without finishing (~5m was
    # the norm) and was still holding a runner. With one shared runner pool
    # that is head-of-line blocking for every other PR — see the `concurrency`
    # note at the top of this file.
    timeout-minutes: 55
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # `--in-diff` needs the base commit to diff against.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          # Share the `build` cache the other Rust jobs populate, instead of a
          # private key that starts cold on every PR. This job is ADVISORY, and
          # it was spending most of its ~45m rebuilding a workspace three other
          # jobs had already built. `save-if: false` so an advisory job never
          # writes over the cache the gating jobs depend on.
          shared-key: build
          save-if: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libzstd-dev pkg-config protobuf-compiler mold
      - name: Install cargo-mutants
        uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2
        with:
          tool: cargo-mutants
      - name: Compute the PR diff
        # ONE range expression, two artifacts. nw-272: the package list and the
        # mutant list must come from the SAME diff — computing the range twice
        # lets them drift silently, so `--in-diff` could generate a mutant in a
        # package `-p` never built (skipped, invisible) or `-p` could baseline
        # packages with no mutants (the exact cost this scoping removes). Both
        # failure modes look like a normal run.
        run: |
          git diff "origin/${{ github.base_ref }}"...HEAD > /tmp/pr.diff
          git diff --name-only "origin/${{ github.base_ref }}"...HEAD > /tmp/pr.files
      - name: Mutate only what this PR changed
        id: mutate
        # `--workspace` is load-bearing. This repo's root Cargo.toml is BOTH a
        # [workspace] and a [package], so cargo-mutants defaults to the root
        # package alone — src/main.rs and src/setup.rs. Measured: `--list`
        # emitted 2065 mutants, every one of them in those two files, and not
        # one of the 15 library crates (where essentially all the logic lives)
        # had ever been mutated. On one PR's diff that was 1 mutant instead of
        # 3; across a release, 96 instead of 572. Every "No surviving mutants
        # in this diff" this job printed was therefore uninformative — the same
        # manifest shape the Coverage job already works around with --workspace.
        #
        # `--timeout 300` bounds ONE cargo command, not the job: an unkilled
        # mutant can hang a test that would otherwise exit, and without it one
        # pathological mutant stalls everything. It says nothing about total
        # runtime, and cargo-mutants (27.x) has no total-time flag — `--help`
        # offers only per-command `--timeout`/`--build-timeout` and `--shard`.
        # So the budget is enforced here with `timeout`, chosen over sharding
        # (a shard matrix multiplies runners and cold builds for an advisory
        # job) and over a mutant cap (which would silently drop mutants with no
        # wall-clock guarantee anyway).
        #
        # SIGINT rather than SIGKILL so cargo-mutants shuts down cleanly and
        # mutants.out/ keeps the results it had already written; --kill-after
        # covers a process that ignores the interrupt. The exit status is
        # recorded instead of swallowed by `|| true`, because the next step has
        # to be able to tell a clean run from a cut-short one.
        #
        # NESTWEAVER_NO_DAEMON keeps each run hermetic — cargo-mutants requires
        # non-flaky tests, and a shared daemon would make results
        # irreproducible.
        #
        # Not using `-j`: each parallel job needs its own copy of the tree and
        # target dir, and disk (see "Free disk space") is the binding
        # constraint on this runner, not CPU.
        run: |
          set +e
          # nw-272: mutate the packages this DIFF touches, not the whole
          # workspace. `--workspace` (nw-243) made cargo-mutants build and run
          # every crate's test suite as its BASELINE before evaluating a single
          # mutant, and on a 15-crate workspace that alone exceeds the budget:
          # on #322 and #323 it found 53 and 110 mutants and tested ZERO, each
          # time burning the full 35m on the baseline and reporting a green
          # advisory check. nw-243's intent was that library crates be
          # REACHABLE — not that the workspace be rebuilt every run.
          #
          # `--in-diff` already restricts which mutants are GENERATED; `-p`
          # restricts what gets BUILT and baselined, which is the expensive half.
          # Derived from /tmp/pr.files, written by the same step and the same
          # range expression that produced /tmp/pr.diff — see the comment there.
          #
          # `print $2` is the crate DIRECTORY name. That is only valid because
          # every directory under crates/ is named for its package; a future
          # crate where those differ would emit `-p <dir>` and fail loudly,
          # which is the right way for that assumption to break.
          #
          # Patterns are anchored: `/^src\//` and `/^build\.rs$/`, not
          # `/^(src|build\.rs)/`, which would also match `srcgen/` and print a
          # package the diff never touched — a wasted baseline, which is the
          # resource this whole change exists to conserve.
          mapfile -t pkgs < <(awk -F/ '
            /^crates\/[^\/]+\// { print $2 }
            /^src\//            { print "nestweaver" }
            /^build\.rs$/       { print "nestweaver" }
          ' /tmp/pr.files | sort -u)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "no Rust package in this diff; nothing to mutate"
            {
              echo "status=0"
              echo "truncated=false"
              echo "no_packages=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pkg_args=()
          for pkg in "${pkgs[@]}"; do pkg_args+=(-p "${pkg}"); done
          echo "mutating packages: ${pkgs[*]}"
          timeout --signal=INT --kill-after=120s "${MUTANTS_BUDGET}" \
            cargo mutants "${pkg_args[@]}" --in-diff /tmp/pr.diff \
              --timeout 300 --no-shuffle -- --no-fail-fast
          status=$?
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          # GNU timeout reports 124 when it had to interrupt, 137 when the
          # --kill-after SIGKILL was needed.
          if [ "${status}" -eq 124 ] || [ "${status}" -eq 137 ]; then
            echo "truncated=true" >> "$GITHUB_OUTPUT"
            # NOT "partial" — a run cut short during the baseline tests ZERO
            # mutants, and "partial" reads identically whether it reached 80 or
            # none. The job summary carries the real count.
            echo "::warning::Mutation testing hit its ${MUTANTS_BUDGET} budget and was cut short. It may have tested NO mutants at all — read the job summary for how far it actually got before treating this as a clean result."
          else
            echo "truncated=false" >> "$GITHUB_OUTPUT"
          fi
          # Advisory job: surviving mutants (2), timeouts (3) and unviable
          # mutants (4) are findings to report, not build failures.
          exit 0
        env:
          # Deliberately shorter than the job's timeout-minutes so this wrapper,
          # not the runner, is what stops a long run — the difference is the
          # headroom the reporting steps need.
          MUTANTS_BUDGET: 35m
          NESTWEAVER_NO_DAEMON: "1"
          NESTWEAVER_ALLOW_NO_DAEMON: "1"
      - name: Surviving mutants (read these — each one is a test that cannot fail)
        if: always()
        # An absent signal and a clean signal MUST NOT look the same. A run that
        # stopped early, or never ran at all, reports that in place of the
        # all-clear — it never gets to print "No surviving mutants".
        env:
          TRUNCATED: ${{ steps.mutate.outputs.truncated }}
          NO_PACKAGES: ${{ steps.mutate.outputs.no_packages }}
          MUTANTS_STATUS: ${{ steps.mutate.outputs.status }}
        run: |
          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          # nw-272: no Rust package in the diff is legitimately nothing to do —
          # distinct from "the report is missing", which the branch below treats
          # as a non-result. Saying the wrong one of those is the whole defect
          # this job keeps re-learning.
          if [ "${NO_PACKAGES}" = "true" ]; then
            summary "### Mutation testing"
            summary "No Rust package in this diff, so no mutants were generated. Nothing to report."
            exit 0
          fi

          # How far did it actually get? Every mutant that produced a verdict
          # lands in exactly one of these files; mutants.json is the full list
          # generated up front.
          tested=0
          for f in caught missed timeout unviable; do
            if [ -f "mutants.out/${f}.txt" ]; then
              tested=$(( tested + $(wc -l < "mutants.out/${f}.txt") ))
            fi
          done
          total=""
          if [ -f mutants.out/mutants.json ]; then
            total=$(jq 'length' mutants.out/mutants.json 2>/dev/null || echo "")
          fi
          progress="${tested} mutants"
          if [ -n "${total}" ]; then
            progress="${tested} of ${total} mutants"
          fi

          summary "## Mutation testing (advisory)"
          summary ""

          incomplete=false
          if [ "${TRUNCATED}" = "true" ]; then
            incomplete=true
            summary "> [!WARNING]"
            summary "> **TRUNCATED — this run hit its time budget and did not finish.**"
            summary "> It got through **${progress}** before being stopped."
            summary "> The list below is PARTIAL. A mutant missing from it was not"
            summary "> killed — it was never reached. Do not read this as an all-clear."
            summary ""
          elif [ ! -d mutants.out ]; then
            incomplete=true
            summary "> [!WARNING]"
            summary "> **cargo-mutants produced no report** (exit status \`${MUTANTS_STATUS:-unknown}\`)."
            summary "> Nothing was mutated. This is a missing result, not a passing one."
            summary ""
          elif [ "${MUTANTS_STATUS}" = "1" ]; then
            incomplete=true
            summary "> [!WARNING]"
            summary "> **cargo-mutants exited with an error** (status 1) — the run did not"
            summary "> complete normally. Treat any list below as partial."
            summary ""
          fi

          if [ -s mutants.out/missed.txt ]; then
            summary "### Surviving mutants"
            summary ""
            summary "Each line is a change to this PR's code that NO test noticed."
            summary "That is not automatically a defect — but it is a test that would"
            summary "not have caught the bug it appears to guard."
            summary ""
            summary '```'
            cat mutants.out/missed.txt >> "$GITHUB_STEP_SUMMARY"
            summary '```'
          elif [ "${incomplete}" = "true" ]; then
            if [ "${tested}" -eq 0 ]; then
              summary "**No mutants were tested at all.** There is no result here to read."
            else
              summary "No surviving mutants among the ones this run did reach (${progress})."
              summary "The rest were not tested."
            fi
          elif [ "${tested}" -eq 0 ]; then
            # Not a pass and not a failure: the diff touched nothing mutable.
            summary "This PR's diff generated no mutants — nothing in it was mutable."
          else
            summary "No surviving mutants in this diff (${progress} tested)."
          fi
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-report
          path: mutants.out/
          if-no-files-found: ignore

  audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
      # Prebuilt binary via install-action instead of `cargo install cargo-audit`
      # (which compiles it from source on every run, ~3 min).
      - name: Install cargo-audit
        uses: taiki-e/install-action@8e38755317fb11cc24a0cd3b573a64008362d207 # cargo-audit 2026-09-02
        with:
          tool: cargo-audit
      # No `|| true`. This check is displayed as "Security Audit" on every pull
      # request in a public repo, which reads as an enforced supply-chain gate —
      # suppressing the exit code made that a false claim. Verified clean on
      # 2026-07-27: 834 dependencies, 0 vulnerabilities, 2 allowed warnings
      # (RUSTSEC-2024-0436 paste unmaintained, RUSTSEC-2026-0202 cxx unsound),
      # neither of which fails cargo-audit's default policy.
      #
      # When this does fail: triage the advisory, and if it must be accepted,
      # record it in audit.toml with a justification and a review date rather
      # than restoring a blanket suppression.
      - name: Run audit
        run: cargo audit

  secret-scan:
    name: Secret Scan
    # Deliberately NOT gated on needs.changes: a credential can be committed in
    # any file type, including ones no language filter matches.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Full history. This repo is public, so a secret that was committed and
          # later removed is still disclosed and still needs rotating — scanning
          # only the tip would miss exactly the case that matters most.
          fetch-depth: 0
      # Install the binary directly rather than gitleaks-action: the marketplace
      # action requires a GITLEAKS_LICENSE for organization-owned repos, which
      # would make this gate fail for reasons unrelated to the code.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          EXPECTED_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$EXPECTED_SHA256" /tmp/gitleaks.tar.gz | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Verify the config actually loads rules
        # A gitleaks config with no [extend] block and only an [allowlist]
        # silently loads zero detectors and reports "no leaks found" on
        # everything — this repo shipped exactly that config, unused, for
        # months. Prove the scanner is live before trusting a clean result.
        run: |
          set -euo pipefail
          mkdir -p /tmp/gl-probe
          # Assemble the probe token at runtime. Writing it as a literal would
          # commit a credential-shaped string into the repo, which this very
          # scanner then flags on every subsequent run. Split, neither half
          # matches a rule.
          PROBE_PREFIX='ghp_'
          PROBE_BODY='016C7B1D2E3F4a5b6c7d8e9f0A1B2C3D4E5F'
          printf 'token = "%s%s"\n' "$PROBE_PREFIX" "$PROBE_BODY" > /tmp/gl-probe/probe.txt
          if gitleaks detect --source /tmp/gl-probe --config .gitleaks.toml --no-git --redact; then
            echo "::error::gitleaks did not detect a planted credential — the config is not loading rules"
            exit 1
          fi
          echo "config verified: planted credential was detected"
      - name: Scan repository history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  e2e:
    name: E2E Tests
    needs: changes
    # E2E drives the real backend API + the frontend, so run it whenever either
    # side changes.
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      # See the note on the Tests step: the bypass is explicit now.
      NESTWEAVER_ALLOW_NO_DAEMON: "1"
      NESTWEAVER_NO_DAEMON: "1"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          shared-key: build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: crates/nestweaver-web/frontend/package-lock.json
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libzstd-dev pkg-config protobuf-compiler mold
      - name: Install frontend dependencies
        working-directory: crates/nestweaver-web/frontend
        run: npm ci
      - name: Compute native dependency cache key
        id: nativekey
        run: |
          LBUG_VER=$(awk '/^name = "lbug"$/{getline; print $3}' Cargo.lock | tr -d '"')
          OSSL_VER=$(awk '/^name = "openssl-sys"$/{getline; print $3}' Cargo.lock | tr -d '"')
          RUSTC_VER=$(rustc --version | awk '{print $2}')
          echo "key=${LBUG_VER}-${OSSL_VER}-rustc${RUSTC_VER}" >> "$GITHUB_OUTPUT"
      - name: Cache native build outputs (lbug C++, OpenSSL)
        # lbug (C++ graph DB, built from source) and vendored OpenSSL dominate
        # cold-build time. Keyed on their package versions (not Cargo.lock as a
        # whole) so they survive release-please lockfile churn.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            target/**/build/lbug-*/out
            target/**/build/openssl-sys-*/out
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ steps.nativekey.outputs.key }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-
      - name: Build (triggers lbug prebuilt download on first run)
        run: |
          cargo build -p nestweaver-store 2>/dev/null || true
          sleep 2
          cargo build
      - name: Index test data
        env:
          NESTWEAVER_ALLOW_NO_DAEMON: "1"
        run: ./target/debug/nestweaver --no-daemon index --repo testdata/js --db /tmp/test.lbug
      - name: Install Playwright browsers
        working-directory: crates/nestweaver-web/frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: crates/nestweaver-web/frontend
        run: npx playwright test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: crates/nestweaver-web/frontend/playwright-report/

  required-ci:
    name: Required CI
    # `always()` is essential: a failed, cancelled, or unexpectedly skipped
    # prerequisite must be reduced to a failing conclusion, not skip the one
    # check the main-branch ruleset requires.
    if: always()
    needs:
      - changes
      - metal-smoke
      - fmt
      - build-and-check
      - clippy
      - daemon-tests
      - audit
      - secret-scan
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact SHA and reduce required results
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Required CI checked out $ACTUAL_SHA, expected $EXPECTED_SHA" >&2
            exit 1
          fi

          bash scripts/verify-required-ci.sh --self-test
          node npm/install.test.js
          bash scripts/verify-release-bundle.sh --self-test
          bash scripts/verify-release-package.sh --self-test
          bash -n scripts/observe-release-visibility.sh \
            scripts/verify-release-canary-pr.sh
          uses_key=uses
          at_sign=@
          # Strip trailing comments BEFORE testing the pin. The old check
          # required the 40-hex to follow an `@`, but accepted it ANYWHERE on
          # the line -- so `uses: evil/action@v1  # see actions/checkout@<sha>`
          # passed on the hash in its own comment. Trailing whitespace after a
          # valid pin is still a pin, and indented comment-only lines collapse
          # to empty and are dropped rather than reported as unpinned.
          unpinned_actions="$({
            grep -REn "${uses_key}:[[:space:]]+[^[:space:]]+${at_sign}" \
              .github/workflows || true
          } | sed -E 's/[[:space:]]+#.*$//' \
            | grep -Ev "${at_sign}[0-9a-f]{40}[[:space:]]*$" \
            | grep -Ev ':[0-9]+:[[:space:]]*$' || true)"
          if [ -n "$unpinned_actions" ]; then
            echo "::error::every external action must be pinned to a full commit SHA" >&2
            printf '%s\n' "$unpinned_actions" >&2
            exit 1
          fi
          printf '%s\n' "$NEEDS_JSON" | bash scripts/verify-required-ci.sh -
          {
            echo "Required non-advisory CI passed."
            echo ""
            echo "Exact candidate SHA: \`$ACTUAL_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate GitHub Actions workflow syntax
        if: always()
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          tool_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$tool_dir"
          curl --fail-with-body --silent --show-error --location \
            --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" .github/workflows/*.yml
