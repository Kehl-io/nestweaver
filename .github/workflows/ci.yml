name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]
  # A PR created with the repository GITHUB_TOKEN may not emit a pull_request
  # workflow event at all. Maintainers can explicitly run CI from that PR's
  # latest branch head; the Required CI check remains bound to github.sha.
  #
  # TRUST BOUNDARY, recorded so it is not re-derived: workflow_dispatch reads
  # this file from the SELECTED REF, so a dispatch against a branch runs that
  # branch's definition of `Required CI`. That is not a widening -- the
  # `pull_request` trigger above already runs the workflow from the PR's merge
  # ref, so any PR that edits this file already runs its own edited copy. The
  # control for both is maintainer review of workflow edits. The single-owner
  # repository requires PRs and exact-head CI, but does not require an impossible
  # second-owner approval. CODEOWNERS requests review; it is not itself an
  # enforced approval rule. Dispatch additionally requires repository write access.
  workflow_dispatch:
    inputs:
      performance_validation:
        description: Run the scoped backlog benchmarks on an isolated runner
        type: boolean
        default: false

permissions:
  contents: read

# Cancel a PR's earlier run when a new commit supersedes it.
#
# There was no concurrency group at all, so every push to a branch left its
# previous run going: a full matrix — Build & Tests ~1h, Daemon Integration
# ~55m, E2E ~50m, Cold Metal ~43m, mutants ~45m — computing an answer about
# a commit nobody would look at again. With one shared runner pool that is not
# just waste, it is HEAD-OF-LINE BLOCKING: those obsolete jobs sit in front of
# every other PR's real work, which is why runs queued for over an hour while
# several PRs were open.
#
# `cancel-in-progress` is deliberately scoped to pull_request. A push to main
# must NEVER be cancelled — release-please and the publish flow run there, and
# cancelling one mid-flight would leave a release half-cut.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # nw-812: the index CPU budget is process-wide; test binaries and the
  # daemons they start run many indexes at once, so disable it for CI.
  NESTWEAVER_INDEX_CPU_PERCENT: "0"
  LBUG_BUILD_FROM_SOURCE: "1"
  CFLAGS: "-DZSTD_DISABLE_ASM"
  # mold, purely for link speed. Set as an env override rather than appended to
  # .cargo/config.toml: a second [target.x86_64-unknown-linux-gnu] table is a
  # TOML duplicate key and fails the build outright. No duplicate-symbol
  # suppression belongs here — exactly one copy of zstd is linked, so nothing
  # needs tolerating. See .cargo/config.toml.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  backlog-performance:
    name: Scoped backlog performance evidence
    if: github.event_name == 'workflow_dispatch' && inputs.performance_validation
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Check out the pinned LadybugDB source
        # Sets LBUG_SOURCE_DIR for the lbug build. The tag and commit live
        # in scripts/fetch-lbug-source.sh only.
        run: scripts/fetch-lbug-source.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Only main saves: branch and PR caches are unreadable elsewhere and
          # evicted main's under the 10 GB repository cap. Branches restore main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: backlog-performance
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev protobuf-compiler mold time
      - name: Build benchmarks before measuring
        run: |
          cargo bench --locked --bench remove_repo_benchmarks --no-run
          cargo build --locked --release --example project_materialization_benchmark
          cargo test --locked --release --workspace --lib --no-run
      - name: Record controlled performance evidence
        run: bash scripts/run-backlog-benchmarks.sh
      - name: Preserve raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backlog-performance-${{ github.sha }}
          path: backlog-performance/
          if-no-files-found: error

  # Detect what actually changed so we don't recompile the entire Rust
  # workspace (~50 min) for a frontend-only PR, or run the frontend/e2e
  # stack for a pure-Rust change. Branch protection requires only the stable
  # `Required CI` aggregate below; that job interprets these conditional skips
  # instead of asking GitHub to require job names that may not be created.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      metal: ${{ steps.filter.outputs.metal }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - 'tests/support/isolated_daemon.py'
              - 'tests/support/release_*.py'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-please.yml'
              - '.github/CODEOWNERS'
              - '.github/main-ruleset.json'
              - 'CONTRIBUTING.md'
              - 'release-please-config.json'
              - 'scripts/observe-release-visibility.sh'
              - 'scripts/verify-release-canary-pr.sh'
              - 'scripts/verify-release-bundle.sh'
              - 'scripts/verify-release-package.sh'
              - 'scripts/verify-required-ci.sh'
              - 'scripts/mutation-canary.py'
              - 'scripts/verify-mutation-prerequisite.py'
              - 'scripts/verify-main-rules.sh'
              - 'scripts/verify-linux-archive.py'
              - 'scripts/verify-release-fault.py'
              - 'scripts/test-verify-release-fault.py'
              - 'scripts/run-backlog-benchmarks.sh'
              # The pinned LadybugDB source every compiling job builds from,
              # and the other build entry points that fetch it.
              - 'scripts/fetch-lbug-source.sh'
              - 'Dockerfile'
              - '.dockerignore'
              - '.devcontainer/**'
              - 'examples/**'
              - 'instance.toml'
              - 'INSTALL.md'
              - 'README.md'
              - 'CLAUDE.md'
              - 'docs/**'
              - 'npm/**'
              - 'smithery.yaml'
            metal:
              - 'app/Sources/**'
              - 'app/Tests/**'
              - 'app/build.sh'
              - 'crates/nestweaver-embed/**'
              - 'crates/nestweaver-daemon/src/lifecycle.rs'
              - 'crates/nestweaver-daemon/src/launchd.rs'
              - 'crates/nestweaver-daemon/src/server.rs'
              - 'crates/nestweaver-daemon/Cargo.toml'
              - 'crates/nestweaver-client/src/autostart.rs'
              - 'src/main.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-please.yml'
              - 'tests/metal_smoke.rs'
              # nw-461: metal-smoke now also runs this file's process-level
              # regression tests (see the "Ready-regression integration
              # tests" step below), so a change to it must re-run the job.
              - 'tests/ready_regression_test.rs'
              - 'tests/support/isolated_daemon.py'
              - 'scripts/fetch-lbug-source.sh'
              - 'scripts/ci-build-observe.py'
            frontend:
              - 'crates/nestweaver-web/frontend/**'

  metal-smoke:
    name: Cold Metal daemon smoke
    needs: changes
    if: needs.changes.outputs.metal == 'true'
    runs-on: macos-latest
    # 60 did not fit a COLD cache. Measured on the run that failed: 36m14s to
    # build the release binary, then 5m51s + 12m51s of release test gates, and
    # the wall hit during the fourth step — so the job died having reached NONE
    # of the Metal smoke steps it exists for, and reported that as a Metal
    # failure.
    #
    # It was also self-perpetuating: dying with rustc still writing target/
    # made rust-cache's save step fail with "file changed as we read it", so
    # nothing was cached and the next run was cold too. Two PRs failed this way
    # back to back. The budget has to cover a cold build, not just a warm one.
    timeout-minutes: 90
    env:
      NESTWEAVER_ALLOW_NO_DAEMON: "1"
      MACOSX_DEPLOYMENT_TARGET: "13.3"
      NESTWEAVER_METAL_SMOKE_MODEL_ID: sentence-transformers/all-MiniLM-L6-v2
    steps:
      - name: Verify native Apple Silicon runner
        shell: bash
        run: test "$(uname -m)" = "arm64"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Launcher fixtures and native compile
        shell: bash
        run: |
          set -euo pipefail
          swiftc app/Sources/DatabaseSelection.swift app/Tests/DatabaseSelectionTests.swift -o "$RUNNER_TEMP/DatabaseSelectionTests"
          "$RUNNER_TEMP/DatabaseSelectionTests"
          swiftc app/Sources/UIChildReadiness.swift app/Tests/UIChildReadinessTests.swift -o "$RUNNER_TEMP/UIChildReadinessTests"
          "$RUNNER_TEMP/UIChildReadinessTests"
          swiftc app/Sources/main.swift app/Sources/DatabaseSelection.swift app/Sources/UIChildReadiness.swift -framework AppKit -o "$RUNNER_TEMP/NestWeaverLauncher"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
      - name: Check out the pinned LadybugDB source
        # Sets LBUG_SOURCE_DIR for the lbug build. The tag and commit live
        # in scripts/fetch-lbug-source.sh only.
        run: scripts/fetch-lbug-source.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        id: metal-cache
        with:
          # Only main saves: branch and PR caches are unreadable elsewhere and
          # evicted main's under the 10 GB repository cap. Branches restore main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # A cancelled build saved an incomplete exact-key cache; later hits
          # cannot replace it. Seed this new namespace only after success.
          cache-on-failure: false
          shared-key: metal-smoke-complete-v1
      - name: Record Metal cache outcome
        env:
          METAL_CACHE_HIT: ${{ steps.metal-cache.outputs.cache-hit }}
        run: |
          mkdir -p "$RUNNER_TEMP/metal-build-evidence"
          printf 'cache-hit=%s\n' "$METAL_CACHE_HIT" | tee "$RUNNER_TEMP/metal-build-evidence/cache.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Install build dependencies
        # nw-381: `aws/tap` ships PRE-TAPPED on GitHub's macOS runner image;
        # nothing here taps or uses it. Homebrew's per-tap trust check then
        # prints an "ignoring untrusted tap" warning on stderr, which GitHub
        # renders as a warning ANNOTATION on an otherwise green job -- and one
        # of those was already mistaken for a build failure once. `protobuf`
        # lives in homebrew/core, so untapping something the build never uses
        # cannot affect the install.
        #
        # `|| true` is load-bearing: the tap is absent on some images and
        # `brew untap` on a missing tap exits non-zero.
        #
        # DELIBERATELY NOT `HOMEBREW_NO_REQUIRE_TAP_TRUST=1` -- Homebrew's own
        # message says that is not recommended and will be removed, so it buys
        # a silence that expires and leaves the same work to do.
        run: |
          brew untap aws/tap || true
          brew install protobuf
      - name: Build Metal-enabled CLI
        run: |
          python3 scripts/ci-build-observe.py metal-cli -- cargo build --locked --release --features metal
          mkdir -p staged/standard
          cp target/release/nestweaver staged/standard/nestweaver
          codesign --force --sign - staged/standard/nestweaver
          chmod a-w staged/standard/nestweaver
      - name: Standard Metal artifact daemon acceptance
        run: |
          unset NESTWEAVER_NO_DAEMON NESTWEAVER_ALLOW_NO_DAEMON
          python3 tests/support/isolated_daemon.py --binary "$PWD/staged/standard/nestweaver" --ci-policy-test
      - name: Retain standard Metal daemon evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: standard-metal-daemon-evidence
          path: |
            /tmp/nw-release-*/evidence.jsonl
            /tmp/nw-release-*/daemon.log
          if-no-files-found: error
      - name: Record real model cache baseline (nw-483)
        # nw-483: distinct from this job's own $MODEL_CACHE (set up below by
        # "Configure isolated smoke paths" and deliberately exercised by the
        # Metal smoke steps) — this is the REAL platform default a test can
        # still reach via EmbedConfig::default() / EmbeddingConfig::default()
        # if it forgets to override cache_dir. Runners are ephemeral, so this
        # only has to prove the directory did not exist before this job's
        # tests ran and does after — not survive across jobs/runs.
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$HOME/Library/Caches/nestweaver/models"
          if [ -d "$cache_dir" ]; then
            echo "NW_MODEL_CACHE_PREEXISTED=true" >> "$GITHUB_ENV"
          else
            echo "NW_MODEL_CACHE_PREEXISTED=false" >> "$GITHUB_ENV"
          fi
      # Package-only metal omitted daemon/embed and ran zero named tests.
      # Use the workspace unit graph here so the real cache-only test runs,
      # then reuse these library test binaries in the complete unit step.
      # The observation wrapper rejects a missing or ignored named test.
      - name: Verify daemon cache-only contract
        run: |
          python3 scripts/ci-build-observe.py metal-daemon-contract --require-test server::embedding_load_config_tests::daemon_embedding_startup_constructs_cached_model_offline -- cargo test --locked --release \
            --workspace --lib --features metal,ci-direct-tests \
            -- server::embedding_load_config_tests::daemon_embedding_startup_constructs_cached_model_offline --exact
      # nw-194: this job used to run ONLY the one named test above, so every
      # macOS-specific failure was invisible to CI while being the first thing a
      # developer on the project's primary platform hit. Eleven were accumulating
      # in nestweaver-daemon and four more in nestweaver-mcp, all from the same
      # small set of portability assumptions (/bin/true, $XDG_STATE_HOME,
      # non-UTF-8 filenames, Linux pid reuse).
      #
      # Scoped to the WORKSPACE, not just the daemon: the class recurred in a
      # second crate precisely because the gate was per-crate. --lib keeps this
      # to unit tests; the ubuntu job still carries integration coverage.
      # nw-205: --no-fail-fast. Without it a failure in one crate ABORTS the
      # remaining crates, and the job reports a single non-zero exit that reads
      # like a verdict on the whole workspace while later crates were never run
      # at all. That is how a daemon-crate flake hid the store and engine
      # suites entirely. Every other test job here already passes it.
      - name: Workspace unit tests (macOS portability gate)
        run: python3 scripts/ci-build-observe.py metal-workspace-units -- cargo test --locked --release --features metal,ci-direct-tests --workspace --lib --no-fail-fast
      # The --lib gate above did not cover INTEGRATION tests, and two of them
      # were failing on macOS the whole time: one #[cfg(target_os = "macos")]
      # test Linux CI can never run, and one gc test that passes on Linux but
      # diverges on macOS. Both are fixed; this keeps them fixed.
      - name: Daemon integration tests (macOS portability gate)
        run: |
          python3 scripts/ci-build-observe.py metal-daemon-integration-build -- cargo test --locked --release --features metal,ci-direct-tests --test daemon_test --no-run
          codesign --force --sign - target/release/nestweaver
          codesign --verify --strict --verbose=2 target/release/nestweaver
          codesign --display --verbose=2 target/release/nestweaver
          cargo test --locked --release --features metal,ci-direct-tests --test daemon_test
          mkdir -p staged/ci-direct
          cp target/release/nestweaver staged/ci-direct/nestweaver
          chmod a-w staged/ci-direct/nestweaver
      # nw-461: THE THREE macOS-divergent regressions in this repo's history
      # (nw-450 GNU-vs-BSD `tar | grep -q` under `pipefail`, nw-440 GNU-only
      # `find -printf`/`mapfile` in both release verifiers, and an
      # uncanonicalised `/var` vs `/private/var` path comparison from PR
      # #373) were each invisible to CI until a human hit them locally on
      # macOS, because `tests/ready_regression_test.rs` sits outside both the
      # `--lib` gate above and `--test daemon_test`. This step closes that
      # gap. Same `--locked --release --features metal` shape as the two test
      # steps above it, so it links a new test binary against artifacts this
      # job already built instead of forcing a second full compile, and its
      # fixtures spawn the SAME already-codesigned `target/release/nestweaver`
      # (via `assert_cmd::Command::cargo_bin`), so no extra codesign step is
      # needed. 17 of the file's 18 tests compile and run here; the 18th
      # (`selected_pull_rejects_unknown_instance_and_uses_registered_workspace`)
      # is `#[cfg(target_os = "linux")]`, since it depends on XDG registry
      # paths this platform does not use, so it does not add to this job's
      # time. CI time: on the order of single-digit minutes -- each test
      # spawns a real CLI subprocess against a temp git repo and a temp
      # database, comparable in shape to the daemon_test step above, well
      # inside this job's 90-minute budget (which already assumes a cold
      # 36-minute build). Deliberately placed BETWEEN the nw-483 real-model-
      # cache baseline step above and its verify step below, so a regression
      # this suite might introduce there is still caught by that guard, and
      # BEFORE "Collect macOS crash reports" so a SIGSEGV in these fixtures
      # (nw-222, a ~15% flake on this job) still produces a diagnostic
      # report. `--no-fail-fast` for the same reason nw-205 added it to the
      # step above: one failing test must not hide the other 15.
      - name: Ready-regression integration tests (macOS portability gate)
        run: cargo test --locked --release --features metal,ci-direct-tests --test ready_regression_test --no-fail-fast
      # nw-222: the ONE artifact that would identify the recurring SIGSEGV.
      #
      # A test binary has died with `signal: 11` on ~15% of runs of this job,
      # including on a PR that changed zero Rust. Every occurrence has been
      # diagnosed from cargo's one-line summary, which names the binary and
      # nothing else — not the faulting thread, not a symbolized frame, not the
      # fault address. macOS writes all of that to a `.ips` in
      # DiagnosticReports, and we have simply never collected it.
      #
      # `if: failure()` so it costs nothing on a green run, and
      # `continue-on-error` so a missing report directory can never turn a real
      # failure into a confusing second one.
      - name: Collect macOS crash reports
        # No `continue-on-error`: a contract test asserts this job carries none,
        # because the Metal smoke is a required gate and not an informational
        # one. The guard cannot distinguish a step-level flag from a job-level
        # one, and weakening it to accommodate a diagnostic step would trade a
        # real invariant for convenience. It is not needed anyway — this runs
        # only when the job has ALREADY failed, so a failure here cannot change
        # the outcome, and the script tolerates a missing directory itself.
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          dest="$RUNNER_TEMP/crash-reports"
          mkdir -p "$dest"
          for dir in "$HOME/Library/Logs/DiagnosticReports" \
                     "$HOME/Library/Logs/DiagnosticReports/Retired" \
                     "/Library/Logs/DiagnosticReports"; do
            [ -d "$dir" ] || continue
            # Only ours. A runner image ships unrelated reports, and a folder
            # of noise is how a useful artifact gets ignored.
            find "$dir" -maxdepth 1 -type f \( -name 'nestweaver*' -o -name 'cargo*' \
              -o -name 'lbug*' -o -name '*nestweaver*' \) -exec cp {} "$dest/" \; 2>/dev/null || true
          done
          count=$(find "$dest" -type f | wc -l | tr -d ' ')
          echo "collected $count crash report(s)"
          # Surface the decisive lines in the log itself, so a reader does not
          # have to download an artifact to learn whether this was the SIGSEGV.
          for report in "$dest"/*; do
            [ -f "$report" ] || continue
            echo "── $(basename "$report") ──"
            head -c 4000 "$report"
            echo
          done
      - name: Upload macOS crash reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-crash-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crash-reports
          if-no-files-found: ignore
          retention-days: 14
      - name: Configure isolated smoke paths
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          TARGET_ROOT="$HOME/Library/Caches/io.kehl.nestweaver-metal-smoke/$SMOKE_KEY"
          SETUP_ROOT="$RUNNER_TEMP/nestweaver-metal-cache-$SMOKE_KEY"
          TARGET_DB="$TARGET_ROOT/brain.lbug"
          TARGET_CONFIG="$TARGET_ROOT/instance.toml"
          SETUP_DB="$SETUP_ROOT/cache-seed.lbug"
          MODEL_CACHE="$SETUP_ROOT/model-cache"
          OUTPUT_DIR="$RUNNER_TEMP/nestweaver-metal-evidence-$SMOKE_KEY"
          mkdir -p "$TARGET_ROOT" "$SETUP_ROOT"
          CANONICAL_DB="$(cd "$TARGET_ROOT" && pwd -P)/brain.lbug"
          INSTANCE_ID="$(printf '%s' "$CANONICAL_DB" | shasum -a 256 | cut -c1-8)"
          RUNTIME_DIR="$HOME/.local/state/nestweaver/$INSTANCE_ID"
          {
            echo "TARGET_ROOT=$TARGET_ROOT"
            echo "SETUP_ROOT=$SETUP_ROOT"
            echo "TARGET_DB=$TARGET_DB"
            echo "TARGET_CONFIG=$TARGET_CONFIG"
            echo "SETUP_DB=$SETUP_DB"
            echo "MODEL_CACHE=$MODEL_CACHE"
            echo "OUTPUT_DIR=$OUTPUT_DIR"
            echo "INSTANCE_ID=$INSTANCE_ID"
            echo "RUNTIME_DIR=$RUNTIME_DIR"
            echo "PLIST_PATH=$HOME/Library/LaunchAgents/io.kehl.nestweaver.$INSTANCE_ID.plist"
            echo "NESTWEAVER_METAL_SMOKE_DB=$TARGET_DB"
            echo "NESTWEAVER_METAL_SMOKE_OUTPUT_DIR=$OUTPUT_DIR"
            echo "NESTWEAVER_METAL_SMOKE_CACHE_DIR=$MODEL_CACHE"
          } >> "$GITHUB_ENV"
      - name: Populate model cache on CPU
        shell: bash
        env:
          # THE failure this fixes. Without it, `--no-daemon` was ignored, the
          # index step autostarted a daemon against the seed DB, that daemon took
          # the write lease, and the embed step below refused — correctly — to
          # become a second writer. Two commands, one intended to be isolated,
          # silently disagreeing about whether a daemon was in play.
          NESTWEAVER_ALLOW_NO_DAEMON: "1"
        run: |
          set -euo pipefail
          BIN="$PWD/staged/ci-direct/nestweaver"
          "$BIN" --no-daemon index \
            --repo testdata/js --db "$SETUP_DB"
          "$BIN" --no-daemon embed --local --accelerator cpu \
            --cache-dir "$MODEL_CACHE" --db "$SETUP_DB" \
            --scope symbols --force
          find "$MODEL_CACHE" -type f -print0 |
            sort -z |
            xargs -0 shasum -a 256 > "$SETUP_ROOT/cache-before.sha256"
          chmod -R a-w "$MODEL_CACHE"
      - name: Assert clean daemon preconditions
        run: |
          cargo test --locked --release --features metal,ci-direct-tests --test metal_smoke \
            apple_hardware::cold_daemon_preconditions_are_clean \
            -- --ignored --exact --nocapture
      - name: Write explicit Metal instance config
        shell: bash
        run: |
          {
            printf 'instance_id = "metal-smoke"\n\n'
            printf '[snapshot_storage]\nbackend = "local"\npath = "%s/snapshots"\n\n' "$TARGET_ROOT"
            printf '[workspace]\nbackend = "local"\npath = "%s/workspace"\n\n' "$TARGET_ROOT"
            printf '[inference]\nendpoint = "http://127.0.0.1:9"\n'
            printf 'embedding_model = "unused"\nsummary_model = "unused"\n\n'
            printf '[embedding]\nmodel_id = "%s"\n' "$NESTWEAVER_METAL_SMOKE_MODEL_ID"
            printf 'accelerator = "metal"\ncache_dir = "%s"\n\n' "$MODEL_CACHE"
            printf '[git]\ncredential_method = "gh"\n'
          } > "$TARGET_CONFIG"
          ./target/release/nestweaver config validate "$TARGET_CONFIG"
      - name: Cold Metal daemon inference
        shell: bash
        run: |
          set -euo pipefail
          unset NESTWEAVER_NO_DAEMON NESTWEAVER_ALLOW_NO_DAEMON
          BIN="$PWD/staged/standard/nestweaver"
          mkdir -p "$OUTPUT_DIR"
          "$BIN" index --repo testdata/js --db "$TARGET_DB" --config "$TARGET_CONFIG" \
            >"$OUTPUT_DIR/cold-index.stdout" 2>"$OUTPUT_DIR/cold-index.stderr"

          ready=false
          for _ in $(seq 1 60); do
            if "$BIN" brain status --db "$TARGET_DB" --config "$TARGET_CONFIG" --json \
              >"$OUTPUT_DIR/cold-status.json" 2>"$OUTPUT_DIR/cold-status.stderr" &&
              jq -e '
                .embedding_status.state == "ready" and
                .embedding_status.requested_device == "metal" and
                .embedding_status.selected_device == "metal" and
                .embedding_status.fallback_used == false
              ' "$OUTPUT_DIR/cold-status.json" >/dev/null; then
              ready=true
              break
            fi
            if jq -e '.embedding_status.state == "failed"' \
              "$OUTPUT_DIR/cold-status.json" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          test "$ready" = true
          test -f "$PLIST_PATH"
          launchctl print "gui/$(id -u)/io.kehl.nestweaver.$INSTANCE_ID" \
            >"$OUTPUT_DIR/cold-launchd.txt"
          "$BIN" embed --db "$TARGET_DB" --scope symbols --force --stats \
            >"$OUTPUT_DIR/cold-embed.stdout" 2>"$OUTPUT_DIR/cold-embed.stderr"
          grep -q "Embedding via daemon" "$OUTPUT_DIR/cold-embed.stderr"
      - name: Restart and repeat warm Metal inference
        shell: bash
        run: |
          set -euo pipefail
          unset NESTWEAVER_NO_DAEMON NESTWEAVER_ALLOW_NO_DAEMON
          BIN="$PWD/staged/standard/nestweaver"
          "$BIN" daemon --db "$TARGET_DB" stop \
            >"$OUTPUT_DIR/stop.stdout" 2>"$OUTPUT_DIR/stop.stderr"

          ready=false
          for _ in $(seq 1 60); do
            if "$BIN" brain status --db "$TARGET_DB" --config "$TARGET_CONFIG" --json \
              >"$OUTPUT_DIR/warm-status.json" 2>"$OUTPUT_DIR/warm-status.stderr" &&
              jq -e '
                .embedding_status.state == "ready" and
                .embedding_status.requested_device == "metal" and
                .embedding_status.selected_device == "metal" and
                .embedding_status.fallback_used == false
              ' "$OUTPUT_DIR/warm-status.json" >/dev/null; then
              ready=true
              break
            fi
            if jq -e '.embedding_status.state == "failed"' \
              "$OUTPUT_DIR/warm-status.json" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          test "$ready" = true
          test -f "$PLIST_PATH"
          launchctl print "gui/$(id -u)/io.kehl.nestweaver.$INSTANCE_ID" \
            >"$OUTPUT_DIR/warm-launchd.txt"
          "$BIN" embed --db "$TARGET_DB" --scope symbols --force --stats \
            >"$OUTPUT_DIR/warm-embed.stdout" 2>"$OUTPUT_DIR/warm-embed.stderr"
          grep -q "Embedding via daemon" "$OUTPUT_DIR/warm-embed.stderr"
      - name: Verify cache-only Metal vector
        run: |
          cargo test --locked --release --features metal,ci-direct-tests --test metal_smoke \
            apple_hardware::metal_embedding_is_finite_normalized_and_uses_metal \
            -- --ignored --exact --nocapture
          find "$MODEL_CACHE" -type f -print0 |
            sort -z |
            xargs -0 shasum -a 256 > "$SETUP_ROOT/cache-after.sha256"
          diff -u "$SETUP_ROOT/cache-before.sha256" "$SETUP_ROOT/cache-after.sha256"
      - name: Verify no test reached the real model cache (nw-483)
        # Deliberately does not re-run any tests (that would extend this
        # already 90-minute-budgeted job) — it only inspects the filesystem
        # side effect the cargo test steps above may have left in the REAL
        # cache, as opposed to this job's own isolated $MODEL_CACHE (checked
        # separately by the before/after sha256 diff above). `if: always()`
        # so a failure above still gets this check; only a cancelled job
        # skips it.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$HOME/Library/Caches/nestweaver/models"
          if [ ! -d "$cache_dir" ]; then
            exit 0
          fi
          if [ "${NW_MODEL_CACHE_PREEXISTED:-false}" = "true" ]; then
            echo "::warning::$cache_dir exists, but it already existed before this job's tests ran, so this run cannot attribute it to a test (nw-483)."
            exit 0
          fi
          echo "::error::$cache_dir was created during this job's tests — a test reached the real platform model cache instead of an isolated tempdir (nw-483)."
          exit 1
      - name: Collect Metal smoke evidence
        if: failure()
        shell: bash
        run: |
          OUTPUT_DIR="${OUTPUT_DIR:-$RUNNER_TEMP/nestweaver-metal-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}}"
          mkdir -p "$OUTPUT_DIR"
          unset NESTWEAVER_NO_DAEMON NESTWEAVER_ALLOW_NO_DAEMON
          BIN="$PWD/staged/standard/nestweaver"
          "$BIN" diagnostics capabilities --json \
            >"$OUTPUT_DIR/capabilities.json" 2>"$OUTPUT_DIR/capabilities.stderr" || true
          if [ -n "${TARGET_DB:-}" ]; then
            "$BIN" daemon --db "$TARGET_DB" status \
              >"$OUTPUT_DIR/daemon-status.txt" 2>"$OUTPUT_DIR/daemon-status.stderr" || true
          fi
          if [ -n "${RUNTIME_DIR:-}" ] && [ -f "$RUNTIME_DIR/daemon.log" ]; then
            cp "$RUNTIME_DIR/daemon.log" "$OUTPUT_DIR/daemon.log"
          fi
          if [ -n "${INSTANCE_ID:-}" ]; then
            launchctl print "gui/$(id -u)/io.kehl.nestweaver.$INSTANCE_ID" \
              >"$OUTPUT_DIR/launchd.txt" 2>&1 || true
          fi
      - name: Upload Metal smoke evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: metal-smoke-evidence
          path: ${{ runner.temp }}/nestweaver-metal-evidence-${{ github.run_id }}-${{ github.run_attempt }}-metal-smoke
          if-no-files-found: error
      - name: Clean up isolated Metal daemon
        if: always()
        shell: bash
        run: |
          daemon_stopped=false
          if [ -n "${TARGET_DB:-}" ] && [ -x target/release/nestweaver ]; then
            if target/release/nestweaver daemon --db "$TARGET_DB" stop; then
              daemon_stopped=true
            fi
          fi
          if [ "$daemon_stopped" = true ] &&
            [ -n "${INSTANCE_ID:-}" ] &&
            [ "${RUNTIME_DIR:-}" = "$HOME/.local/state/nestweaver/$INSTANCE_ID" ]; then
            case "$RUNTIME_DIR" in
              "$HOME/.local/state/nestweaver/"?*) rm -rf -- "$RUNTIME_DIR" ;;
            esac
          fi
          if [ -n "${MODEL_CACHE:-}" ] && [ -d "$MODEL_CACHE" ]; then
            chmod -R u+w "$MODEL_CACHE" || true
          fi
          case "${TARGET_ROOT:-}" in
            "$HOME/Library/Caches/io.kehl.nestweaver-metal-smoke/"*)
              rm -rf -- "$TARGET_ROOT"
              ;;
          esac
          case "${SETUP_ROOT:-}" in
            "$RUNNER_TEMP/nestweaver-metal-cache-"*) rm -rf -- "$SETUP_ROOT" ;;
          esac
          case "${OUTPUT_DIR:-}" in
            "$RUNNER_TEMP/nestweaver-metal-evidence-"*) rm -rf -- "$OUTPUT_DIR" ;;
          esac

      - name: Retain Metal build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: metal-build-evidence
          path: |
            ${{ runner.temp }}/metal-build-evidence
            target/cargo-timings
          if-no-files-found: warn
          retention-days: 3

  fmt:
    name: Rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build-and-check:
    name: Build & Tests
    # See the daemon-tests timeout-minutes comment for why these bounds exist.
    timeout-minutes: 120
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # Test binaries with full debug info exhaust the GitHub-hosted runner's
      # disk once the entire workspace is compiled. Backtraces still retain
      # symbol names while keeping target/ small enough for the full suite.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
        with:
          components: clippy
      - name: Check out the pinned LadybugDB source
        # Sets LBUG_SOURCE_DIR for the lbug build. The tag and commit live
        # in scripts/fetch-lbug-source.sh only.
        run: scripts/fetch-lbug-source.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Only main saves: branch and PR caches are unreadable elsewhere and
          # evicted main's under the 10 GB repository cap. Branches restore main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
          shared-key: build
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libzstd-dev pkg-config protobuf-compiler mold
      - name: Compute native dependency cache key
        id: nativekey
        run: |
          LBUG_VER=$(awk '/^name = "lbug"$/{getline; print $3}' Cargo.lock | tr -d '"')
          OSSL_VER=$(awk '/^name = "openssl-sys"$/{getline; print $3}' Cargo.lock | tr -d '"')
          RUSTC_VER=$(rustc --version | awk '{print $2}')
          echo "key=${LBUG_VER}-${OSSL_VER}-rustc${RUSTC_VER}" >> "$GITHUB_OUTPUT"
      - name: Cache native build outputs (lbug C++, OpenSSL)
        # lbug (C++ graph DB, built from source) and vendored OpenSSL dominate
        # cold-build time. Keyed on their package versions (not Cargo.lock as a
        # whole) so they survive release-please lockfile churn. Restore only:
        # Build & Tests saves it on main, so branches never evict main's copy.
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            target/**/build/lbug-*/out
            target/**/build/openssl-sys-*/out
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ steps.nativekey.outputs.key }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate lockfile
        # Build dependencies with the real CLI/workspace feature graph below.
        # A standalone store build omits cc/parallel, producing another native
        # build-script configuration and paying for a redundant C++ build.
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Build CLI
        run: |
          cargo build --locked
          mkdir -p staged/standard
          cp target/debug/nestweaver staged/standard/nestweaver
          chmod a-w staged/standard/nestweaver
      - name: Save native build outputs (main only)
        if: github.ref == 'refs/heads/main' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            target/**/build/lbug-*/out
            target/**/build/openssl-sys-*/out
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ steps.nativekey.outputs.key }}
      - name: Stage standard acceptance artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-standard-linux
          path: staged/standard/nestweaver
          if-no-files-found: error
          retention-days: 1
      - name: Validate canonical instance config
        run: cargo run --locked -- config validate examples/minimal-instance.toml
      - name: Type-check benchmarks
        # Bench targets are built by neither `cargo build` nor `cargo test`, so
        # nothing here compiled them until this step existed and they rotted
        # unnoticed. `check --benches` catches a bench that stops compiling
        # without paying for a full release-profile `bench --no-run`.
        run: cargo check --locked --benches
      - name: Record real model cache baseline (nw-483)
        # nw-483: a test can still reach EmbedConfig::default() /
        # EmbeddingConfig::default() and download into the REAL platform
        # cache instead of a test-owned tempdir. Runners are ephemeral, so
        # this only has to prove the directory did not exist before this
        # job's tests ran and does after — not survive across jobs/runs.
        run: |
          set -euo pipefail
          cache_dir="${XDG_CACHE_HOME:-$HOME/.cache}/nestweaver/models"
          if [ -d "$cache_dir" ]; then
            echo "NW_MODEL_CACHE_PREEXISTED=true" >> "$GITHUB_ENV"
          else
            echo "NW_MODEL_CACHE_PREEXISTED=false" >> "$GITHUB_ENV"
          fi
      - name: Tests
        # --workspace is REQUIRED: the root manifest is both [package] and
        # [workspace], so `cargo test` without it runs ONLY the root package's
        # tests and silently skips every sub-crate's unit tests (engine, store,
        # federation, mcp, …) — where most of the logic lives.
        # One target directory retains native dependencies; immutable copies
        # keep the standard artifact separate from the unpublished CI binary.
        run: |
          cargo test --locked --workspace --features ci-direct-tests --no-fail-fast --no-run
          mkdir -p staged/ci-direct
          cp target/debug/nestweaver staged/ci-direct/nestweaver
          chmod a-w staged/ci-direct/nestweaver
          cargo test --locked --workspace --features ci-direct-tests --no-fail-fast -- --skip daemon_
        env:
          # Explicit, because this PR stops `CI`/`GITHUB_ACTIONS` from conferring
          # the bypass. An ambient variable set by dozens of unrelated tools must
          # not decide whether a database can have two writers; a job that wants
          # the escape hatch now says so.
          NESTWEAVER_ALLOW_NO_DAEMON: "1"
          NESTWEAVER_NO_DAEMON: "1"
      - name: Verify no test reached the real model cache (nw-483)
        # Deliberately does not re-run any tests (that would double this job's
        # duration) — it only inspects the filesystem side effect the tests
        # above may have left. `if: always()` so a test FAILURE above still
        # gets this check; only a cancelled job skips it.
        if: always()
        run: |
          set -euo pipefail
          cache_dir="${XDG_CACHE_HOME:-$HOME/.cache}/nestweaver/models"
          if [ ! -d "$cache_dir" ]; then
            exit 0
          fi
          if [ "${NW_MODEL_CACHE_PREEXISTED:-false}" = "true" ]; then
            echo "::warning::$cache_dir exists, but it already existed before this job's tests ran, so this run cannot attribute it to a test (nw-483)."
            exit 0
          fi
          echo "::error::$cache_dir was created during this job's tests — a test reached the real platform model cache instead of an isolated tempdir (nw-483)."
          exit 1

  standard-daemon:
    name: Standard artifact daemon acceptance
    needs: [changes, build-and-check]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-standard-linux
          path: staged/standard
      - name: Standard daemon bootstrap and explicit CI rejection probe
        run: |
          unset NESTWEAVER_NO_DAEMON NESTWEAVER_ALLOW_NO_DAEMON
          chmod 555 staged/standard/nestweaver
          python3 tests/support/isolated_daemon.py --binary "$PWD/staged/standard/nestweaver" --ci-policy-test
      - name: Standard artifact release contracts
        run: |
          unset NESTWEAVER_NO_DAEMON NESTWEAVER_ALLOW_NO_DAEMON
          for suite in release_selectors release_gates release_notes release_dead_code release_dead_code_witnesses release_routes release_publication; do
            python3 "tests/support/$suite.py" --binary "$PWD/staged/standard/nestweaver"
          done
          python3 tests/support/release_selectors.py --binary "$PWD/staged/standard/nestweaver" --during-index
      - name: Retain owned daemon evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: standard-daemon-evidence
          path: |
            /tmp/nw-release-*/evidence.jsonl
            /tmp/nw-release-*/daemon.log
            /tmp/nw-release-*/ui.log
          if-no-files-found: error
          retention-days: 3

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # Match the test/build cache profile instead of creating another namespace.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
