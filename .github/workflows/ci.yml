  daemon-tests:
    name: Daemon Integration Tests
    # These jobs spawn real daemon processes and real test binaries, so a
    # deadlocked test does not fail — it parks the binary and the job runs to
    # GitHub's 360-minute DEFAULT. That is not hypothetical: run 35053752832
    # sat here 03:57 -> 09:59 UTC on a single wedged test
    # (`daemon_embed_joins_an_in_flight_auto_repair_download`), printed no
    # `test result:` line, and was killed six hours later with an orphaned
    # `nestweaver_daemon-*` process. Six hours of a shared runner bought one
    # bit of information.
    #
    # Bounds below are ~2x the observed successful maximum over the last five
    # green runs of each job (daemon-tests 54m, build-and-check 69m, e2e 54m,
    # coverage 111m), so a slow runner still passes while a hang surfaces in
    # hours rather than most of a day. Raise a bound if a job legitimately
    # grows into it; do not remove it.
