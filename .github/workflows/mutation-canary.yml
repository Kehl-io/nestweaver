name: Mutation infrastructure canaries (expected negative job failure)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Current main full SHA with successful actual normal CI runtime jobs
        required: true
        type: string
      prerequisite_run_id:
        description: Newest same-SHA main push ci.yml run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: mutation-canary-${{ github.repository }}
  cancel-in-progress: false

jobs:
  canary-cases:
    name: Canary cases (outer-budget negative MUST fail this job)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      PREREQUISITE_RUN_ID: ${{ inputs.prerequisite_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Bind current main and actual same-SHA runtime prerequisites before setup
        run: |
          python3 scripts/verify-mutation-prerequisite.py --sha "$EXPECTED_SHA" \
            --run-id "$PREREQUISITE_RUN_ID" --output "$RUNNER_TEMP/mutation-evidence/prerequisite.json"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Real fixture zero, complete and deliberately exhausted cases
        run: python3 scripts/mutation-canary.py run --evidence "$RUNNER_TEMP/mutation-evidence"
      - name: Upload this attempt's diagnostic evidence even after expected failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-evidence/
          if-no-files-found: error
          retention-days: 7

  canary-verdict:
    name: Canary verdict (green means the expected red job was proven)
    needs: canary-cases
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      PREREQUISITE_RUN_ID: ${{ inputs.prerequisite_run_id }}
      UPSTREAM_RESULT: ${{ needs.canary-cases.result }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-evidence/
      - name: Verify exact case contracts and raw negative job failure
        run: |
          python3 scripts/mutation-canary.py verify --evidence "$RUNNER_TEMP/mutation-evidence" \
            --upstream-result "$UPSTREAM_RESULT"
      - name: Reject changed main or prerequisite reruns
        run: |
          python3 scripts/verify-mutation-prerequisite.py --sha "$EXPECTED_SHA" \
            --run-id "$PREREQUISITE_RUN_ID" --previous "$RUNNER_TEMP/mutation-evidence/prerequisite.json" \
            --output "$RUNNER_TEMP/mutation-prerequisite-final.json"
          echo 'Synthetic mutation infrastructure accepted. The upstream negative job is intentionally red; product PR mutation coverage remains separate.' >> "$GITHUB_STEP_SUMMARY"
