[workspace]
resolver = "2"
members = [
    "crates/nestweaver-algorithms",
    "crates/nestweaver-schema",
    "crates/nestweaver-parser",
    "crates/nestweaver-resolver",
    "crates/nestweaver-store",
    "crates/nestweaver-storage",
    "crates/nestweaver-engine",
    "crates/nestweaver-mcp",
    "crates/nestweaver-web",
    "crates/nestweaver-wasm",
    "crates/nestweaver-proto",
    "crates/nestweaver-daemon",
    "crates/nestweaver-client",
    "crates/nestweaver-embed",
]

[workspace.package]
version = "1.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/Kehl-io/nestweaver"
description = "Code knowledge graph for AI agents"
keywords = ["code-graph", "tree-sitter", "code-analysis", "knowledge-graph", "mcp"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
nestweaver-algorithms = { path = "crates/nestweaver-algorithms" }
nestweaver-schema = { path = "crates/nestweaver-schema" }
nestweaver-parser = { path = "crates/nestweaver-parser" }
nestweaver-resolver = { path = "crates/nestweaver-resolver" }
nestweaver-store = { path = "crates/nestweaver-store" }
nestweaver-storage = { path = "crates/nestweaver-storage" }
nestweaver-engine = { path = "crates/nestweaver-engine" }
nestweaver-mcp = { path = "crates/nestweaver-mcp" }
nestweaver-web = { path = "crates/nestweaver-web" }
nestweaver-proto = { path = "crates/nestweaver-proto" }
nestweaver-daemon = { path = "crates/nestweaver-daemon" }
nestweaver-client = { path = "crates/nestweaver-client" }
nestweaver-embed = { path = "crates/nestweaver-embed" }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tonic-build = "0.14"
tonic-prost-build = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
sha2 = "0.11"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
axum = "0.8"
axum-embed = "0.1"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
tower-http = { version = "0.7", features = ["cors"] }
tokio-stream = "0.1"
open = "5"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
rayon = "1"
dirs = "6"
rmp-serde = "1"

[package]
name = "nestweaver"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
nestweaver-engine = { workspace = true }
nestweaver-store = { workspace = true }
nestweaver-storage = { workspace = true }
nestweaver-schema = { workspace = true }
nestweaver-mcp = { workspace = true, features = ["daemon"] }
nestweaver-web = { workspace = true }
rmp-serde = { workspace = true }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
miette = { version = "7", features = ["fancy"] }
thiserror = { workspace = true }
owo-colors = "4"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
dirs = { workspace = true }
signal-hook = "0.4"
nestweaver-daemon = { workspace = true }
nestweaver-client = { workspace = true }
nestweaver-proto = { workspace = true }
daemonize2 = "0.7"
libc = "0.2"
sha2 = { workspace = true }
hex = "0.4"
tonic.workspace = true
nestweaver-embed = { workspace = true, optional = true }

[features]
default = ["embed"]
embed = ["dep:nestweaver-embed", "nestweaver-daemon/embed"]
metal = ["nestweaver-embed?/metal"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = { workspace = true }
criterion = { version = "0.8", default-features = false }
nestweaver-daemon = { workspace = true }
libc = "0.2"
sha2 = { workspace = true }
hex = "0.4"

[[bench]]
name = "brain_benchmarks"
harness = false

[[bench]]
name = "embed_latency"
harness = false

[[bench]]
name = "index_benchmarks"
harness = false
