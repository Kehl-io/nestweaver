syntax = "proto3";

package nestweaver.daemon.v1;

// ─── Lifecycle ───────────────────────────────────────────────────────

message HealthCheckRequest {}

message HealthCheckResponse {
  string version = 1;
  string instance_id = 2;
  string db_path = 3;
  uint64 uptime_seconds = 4;
  uint32 active_connections = 5;
  reserved 6;
  reserved "db_opened_at";
  // The daemon's own OS PID. Lets the CLI cross-check a pidfile PID against
  // the socket-reported PID before signaling it (B-1: pidfile PID hole).
  uint32 pid = 7;
}

message ShutdownRequest {}

message ShutdownResponse {
  bool ok = 1;
}

// ─── Indexing ────────────────────────────────────────────────────────

// Whether this request wants the trigram pre-filter refreshed.
//
// A plain bool could not distinguish "the caller said no" from "the caller
// said nothing", so a configless `index` sent false and the daemon honoured it
// — discarding its own `[indexing] with_trigrams = true`. UNSPECIFIED is the
// third state that makes deferring to the daemon expressible, mirroring how
// `max_source_file_bytes` already uses zero to mean "use your configured
// value".
enum TrigramPolicy {
  TRIGRAM_POLICY_UNSPECIFIED = 0;  // inherit the daemon's configured policy
  TRIGRAM_POLICY_ENABLED = 1;      // force on for this request
  TRIGRAM_POLICY_DISABLED = 2;     // force off for this request
}

message IndexRepoRequest {
  string repo_path = 1;
  string name = 2;
  bool force = 3;
  // Superseded by `trigram_policy`. Retained so a pre-6.4 client that sets it
  // still forces a refresh; the daemon ORs it into the UNSPECIFIED branch.
  bool with_trigrams = 4;
  bool with_git_activity = 5;
  string instance_id = 6;  // nw-019: logical instance for the indexed data. Empty = daemon decides (config name, else runtime hash).
  bool rebuild_trigrams = 7;
  // Validated client policy. Zero asks the daemon to use its configured/default
  // value; non-zero must remain within the daemon's hard safety bounds.
  uint64 max_source_file_bytes = 8;
  // Three-state trigram policy; see TrigramPolicy.
  TrigramPolicy trigram_policy = 9;
}

message IndexVaultRequest {
  string vault_path = 1;
  string vault_name = 2;
  repeated string extra_ignore_patterns = 3;
  string instance_id = 4;
}

// Incremental vault refresh is a distinct method so an older daemon cannot
// ignore a newly-added field and accidentally perform a full replacement.
message RefreshVaultSinceRequest {
  string vault_path = 1;
  string vault_name = 2;
  repeated string extra_ignore_patterns = 3;
  string instance_id = 4;
  uint64 since_unix_seconds = 5;
}

message RefreshBrainRequest {}

message ReindexSearchRequest {}

message ReindexSearchResponse {
  int32 document_count = 1;
}

// ─── Watching ───────────────────────────────────────────────────────

message WatchVaultRequest {
  string vault_path = 1;
  string vault_name = 2;
  string instance_id = 3;
  repeated string extra_ignore_patterns = 4;
  // Adopt an existing watcher registration instead of being refused by it.
  // `WatchCodeRequest` has carried this since watchers could be orphaned; the
  // vault side did not, so a `brain watch` whose CLI was killed without
  // sending StopWatch (SIGKILL, or a closed terminal — SIGHUP is not handled)
  // blocked every later vault watch for the daemon's lifetime.
  bool force = 5;
}

message WatchVaultResponse {
  bool ok = 1;
  string message = 2;
}

message WatchCodeRequest {
  string repo_path = 1;
  string instance_id = 2;
  // Replace an already-running watcher (e.g. one orphaned when its owning
  // `watch` CLI was kill -9'd) instead of failing with "already running".
  bool force = 3;
}

message WatchCodeResponse {
  bool ok = 1;
  string message = 2;
}

message StopWatchRequest {}

message StopWatchResponse {
  bool ok = 1;
}

enum Phase {
  DISCOVERING = 0;
  PARSING = 1;
  RESOLVING = 2;
  WRITING = 3;
  PAGERANK = 4;
  DONE = 5;
  ERROR = 6;
}

message IndexProgress {
  Phase phase = 1;
  string message = 2;
  uint64 files_processed = 3;
  uint64 files_total = 4;
  uint64 symbols_found = 5;
  uint64 skipped_count = 6;
  repeated IndexSkipDetail skipped_files = 7;
  CoverageStatus coverage_status = 8;
  TrigramRefreshDetail trigram_refresh = 9;
}

enum CoverageStatus {
  COVERAGE_STATUS_UNSPECIFIED = 0;
  COMPLETE = 1;
  DEGRADED = 2;
}

message IndexSkipDetail {
  string path = 1;
  string reason_code = 2;
  string detail = 3;
  optional uint64 observed_bytes = 4;
  optional uint64 limit_bytes = 5;
}

message TrigramRefreshDetail {
  uint64 scopes_refreshed = 1;
  uint64 scopes_unchanged = 2;
  uint64 nodes_added = 3;
  uint64 nodes_changed = 4;
  uint64 nodes_deleted = 5;
  uint64 postings_added = 6;
  uint64 postings_deleted = 7;
  bool migrated_legacy_index = 8;
  uint64 elapsed_ms = 9;
}

// ─── Write RPCs ─────────────────────────────────────────────────────

message MaterializeProjectsRequest {
  string config_path = 1;
  string instance_id = 2;
}

message RemoveVaultRequest {
  string vault_uid = 1;
}

// One post-commit reconciliation stage that failed AFTER a mutation durably
// committed. Its presence on a response NEVER means the mutation was rolled back.
message ReconciliationFailure {
  string stage = 1;
  string repo_uid = 2;  // empty when not repo-scoped
  string message = 3;
}

message RemoveVaultResponse {
  uint64 notes_deleted = 1;
  // True once the destructive mutation durably committed — even if post-commit
  // reconciliation failed. When true, the delete HAPPENED.
  bool committed = 2;
  // Non-empty => the delete SUCCEEDED but N post-commit reconciliation steps
  // failed (retry by re-running the op). NOT a rollback signal.
  repeated ReconciliationFailure reconciliation_failures = 3;
}

message RemoveRepoRequest {
  string repo_uid = 1;
}

message RemoveRepoResponse {
  uint64 files_deleted = 1;
  uint64 symbols_deleted = 2;
  bool committed = 3;
  repeated ReconciliationFailure reconciliation_failures = 4;
}

message RemoveProjectRequest {
  string project_uid = 1;
}

message RemoveProjectResponse {
  string project_name = 1;
  bool committed = 2;
  repeated ReconciliationFailure reconciliation_failures = 3;
}

message PruneStaleRequest {}

message PruneStaleResponse {
  repeated string removed_repos = 1;
  repeated string removed_vaults = 2;
  bool committed = 3;
  repeated ReconciliationFailure reconciliation_failures = 4;
}

// nw-204. Reclaim embedding vectors left behind by deleted graph nodes.
message CompactEmbeddingsRequest {
  // Report occupancy without writing anything. Note that a dry run can only
  // report what is ALREADY tombstoned — orphans that were never tombstoned are
  // found by the reconcile a real run performs, so a dry run's `tombstoned` is
  // a floor, not a total.
  bool dry_run = 1;
}

message CompactEmbeddingsResponse {
  // Occupancy before the run.
  uint64 stored_before = 1;
  uint64 tombstoned_before = 2;
  // Occupancy after. Equal to the `before` values on a dry run.
  uint64 stored_after = 3;
  uint64 live_after = 4;
  // Vectors the reconcile found to be dead. 0 on a dry run.
  uint64 reclaimed = 5;
  // Sidecar file size in bytes, before and after. 0 when the artifact is
  // absent or unreadable, which is not an error — an un-embedded brain has no
  // sidecar and nothing to reclaim.
  uint64 bytes_before = 6;
  uint64 bytes_after = 7;
  bool dry_run = 8;
}

message MergeInstanceRequest {
  string from_id = 1;
  string to_id = 2;
}

message MergeInstanceResponse {
  uint64 vaults_reparented = 1;
  uint64 repos_reparented = 2;
  uint64 projects_reparented = 3;
  repeated string discarded_vaults = 4;
  // Identifiers (display name or url) of repos whose source graph rows were
  // removed during migration. Force re-index recreates those rows under the
  // target instance. Non-empty means the caller should warn the user.
  repeated string repos_needing_reindex = 5;
  bool committed = 6;
  repeated ReconciliationFailure reconciliation_failures = 7;
}

message PurgeInstanceRequest {
  string instance_id = 1;
}

// ─── JSON pass-through for read RPCs ─────────────────────────────────

message JsonRequest {
  string args_json = 1;
}

message JsonResponse {
  string result_json = 1;
}

// Exact daemon contract for `nestweaver contracts list`. This is deliberately
// separate from CrossRepoContracts, which accepts a symbol uid/name and
// returns implementation/reference hypotheses rather than Contract nodes.
message ListContractsRequest {
  // Omitted means all repositories; when present, accepts an exact repo UID
  // or a case-insensitive repository display name. An empty present value is
  // invalid rather than an alias for omission.
  optional string repo = 1;
}

message ContractRecord {
  string uid = 1;
  string kind = 2;
  optional string verb = 3;
  optional string path = 4;
  optional string operation_id = 5;
  string repo_uid = 6;
  string source_path = 7;
  float confidence = 8;
}

message ListContractsResponse {
  repeated ContractRecord contracts = 1;
}

// ─── Typed messages for hot-path RPCs ────────────────────────────────

// brain_search
message BrainSearchRequest {
  string query = 1;
  int32 limit = 2;
  optional string response_format = 3;
  bool include_bodies = 4;
  bool prf = 5;
  bool rerank = 6;
  optional string root = 7;
}
message BrainSearchResponse {
  string query = 1;
  string engine = 2;
  int32 total_matches = 3;
  repeated SearchResultItem results = 4;
  // F7 PRF-mined expansion terms (empty unless prf=true on the request).
  repeated string expansion_terms = 5;
  int32 returned_matches = 6;
  string total_matches_relation = 7; // "eq" | "gte"
  bool truncated = 8;
  bool semantic_applied = 9;
  repeated string degraded_components = 10;
}
message SearchResultItem {
  string uid = 1;
  string kind = 2;
  string title = 3;
  double score = 4;
  optional string location = 5;
  repeated string matched_headings = 6;
  optional string inline_body = 7;
  optional string canonical_id = 8;
  // Vault the note/section hit belongs to (notes only; absent for symbols).
  optional string vault_uid = 9;
}

// brain_status
message BrainStatusRequest {}
message EmbeddingStatus {
  // disabled | loading | ready | failed | embedding
  //
  // `embedding` was added in 4.2 and is reported INSTEAD of `ready` while a
  // daemon-route embedding pass is in flight. It implies the model is loaded
  // and usable — it is a strictly narrower `ready`. Consumers that only care
  // about usability should treat `embedding` as ready; consumers that want an
  // unambiguous machine signal should read `pass_active` instead of matching
  // on this string.
  string state = 1;
  string backend = 2;            // local | external
  string requested_device = 3;   // auto | metal | cpu
  string selected_device = 4;    // metal | cpu | empty
  string model_id = 5;
  string error = 6;
  bool metal_compiled = 7;
  bool fallback_used = 8;        // invariant: always false

  // ── In-flight pass progress (added 4.2) ──────────────────────────
  // All fields are proto3 scalars, so a daemon that predates them decodes as
  // "no pass running" rather than as an error. They describe the daemon-route
  // `Embed` RPC only; a direct (non-daemon) `nestweaver embed` prints its own
  // per-batch counters and never reaches this daemon state.

  // True while an `Embed` RPC is running on this daemon.
  bool pass_active = 9;
  // Nodes this pass has attempted so far (succeeded + failed + rejected).
  uint64 pass_processed = 10;
  // Eligible nodes this pass intends to embed, from the same preflight count
  // `PlanEmbed` reports. 0 means "not yet computed" (preflight still running).
  uint64 pass_total = 11;
  // Unix seconds when the pass started; 0 when no pass is running. Lets a
  // client derive elapsed/throughput/ETA without the daemon guessing for it.
  int64 pass_started_at = 12;
  // Scope string of the running pass (all | symbols | notes | headings).
  string pass_scope = 13;

  // ── Sidecar occupancy (added 7.1, nw-204) ────────────────────────
  // Vectors a query can actually match, versus what the artifact physically
  // stores. `index_stored - index_live` is dead weight that is both wasted
  // disk AND, before it is tombstoned, scored: an untombstoned dead vector
  // outranking a live one silently consumes a top-k slot.
  //
  // Reported so that a brain carrying a majority-dead index cannot keep
  // describing itself as simply "ready", which is how this went unnoticed
  // until over half of a real index was dead. Proto3 scalars, so an older
  // daemon decodes as 0/0 rather than as an error; a client should treat
  // index_stored == 0 as "not reported" rather than "empty index".
  uint64 index_live = 14;
  uint64 index_tombstoned = 15;
  uint64 index_stored = 16;
}
message EffectiveConfig {
  // The daemon's effective configuration source. Absence of EffectiveConfig
  // on BrainStatusResponse means an older daemon that cannot report it.
  oneof source {
    string configured_path = 1;       // canonical absolute path
    CompiledDefaults compiled_defaults = 2;
  }

  // An explicit marker rather than an empty path, so defaults cannot be
  // confused with unknown provenance from an older daemon.
  message CompiledDefaults {}
}
message BrainStatusResponse {
  int32 vault_count = 1;
  int32 notes = 2;
  int32 headings = 3;
  int32 sections = 4;
  int32 tags = 5;
  int32 wikilinks = 6;
  int32 repo_count = 7;
  bool tantivy_available = 8;
  int32 tantivy_doc_count = 9;
  bool indexing_active = 10;
  string indexing_repo = 11;  // repo currently being indexed (empty if idle)
  // Depth of the server-side INDEX JOB queue (pending + running jobs). This
  // has never counted gRPC write RPCs blocked on the daemon write lock, and
  // still does not: it is fed by the SQLite job queue and is consumed by the
  // web admin API and the Prometheus `nestweaver_index_queue_depth` gauge.
  // Blocked write RPCs are reported by `write_queue_depth` below rather than
  // being folded in here, because merging two differently-sourced populations
  // into one integer would make an existing published metric mean something
  // new without renaming it.
  int32 queue_depth = 12;
  EmbeddingStatus embedding_status = 13;
  EffectiveConfig effective_config = 14;

  // ── Write-path visibility (added 4.2) ────────────────────────────
  // Number of gRPC write RPCs currently blocked waiting for the daemon write
  // lock, NOT counting the one holding it. Non-zero means status is asserting
  // "something is queued" instead of silently reporting 0 while a client waits.
  int32 write_queue_depth = 15;
  // What currently holds the daemon write lock — an RPC name for gRPC writers
  // (`embed`, `index_repo`, ...), `worker_commit` for the server-side worker
  // pool, `admin_remove_repo` for the web admin API. Empty when the lock is
  // free. Every writer in the daemon process stamps this, so an empty value
  // while `write_queue_depth` is non-zero indicates a daemon older than 4.2
  // rather than an unidentifiable writer.
  string write_holder = 16;
  // How long the current holder has held the write lock, in seconds; 0 when
  // the lock is free.
  int64 write_holder_seconds = 17;
}

// repo_states — per-repo indexed SHA and metadata for staleness comparison
message RepoStatesRequest {}
message RepoState {
  string repo_uid = 1;
  string repo_url = 2;
  string repo_name = 3;
  string indexed_sha = 4;
  int64 symbol_count = 5;
}
message RepoStatesResponse {
  repeated RepoState repos = 1;
}

// note_get
message NoteGetRequest {
  optional string uid = 1;
  optional string title = 2;
  // nw-316 (same defect as `ProjectContextRequest.include_components`): a
  // proto3 non-optional `bool` decodes an absent field to `false`, so the
  // tool's documented default of `true` could not survive this hop.
  optional bool include_body = 3;
  repeated string sections = 4;
}
message NoteGetResponse {
  string uid = 1;
  string title = 2;
  string path = 3;
  string note_kind = 4;
  int32 word_count = 5;
  optional string body = 6;
  int32 section_count = 7;
  // Parsed frontmatter serialized as a JSON object string ("" when absent),
  // matching the local note_get 'frontmatter' field.
  string frontmatter_json = 8;
  // Heading outline, matching the local note_get 'outline' field.
  repeated NoteHeading outline = 9;
}
message NoteHeading {
  string uid = 1;
  int32 level = 2;
  string text = 3;
  string slug = 4;
  int32 line = 5;
}

// brain_context (typed request, JSON response)
message BrainContextRequest {
  repeated string seeds = 1;
  int32 token_budget = 2;
  string response_format = 3;
  repeated string repos = 4;
  repeated string vaults = 5;
  repeated string kinds = 6;
  string path_prefix = 7;
  repeated string tags = 8;
  repeated string exclude_tags = 9;
  double weight_ppr = 10;
  double weight_bm25 = 11;
  string intent = 12;
  bool include_seeds = 13;
  bool include_bodies = 14;
  string root = 15;
  bool prf = 16;
  bool rerank = 17;
  double weight_semantic = 18;
  string since = 19;
  double recency_weight = 20;
  double recency_half_life_days = 21;
}
message BrainContextResponse {
  string result_json = 1;
  bool semantic_applied = 2;
  repeated string degraded_components = 3;
}

// project_context (typed request, JSON response)
message ProjectContextRequest {
  string project = 1;
  int32 token_budget = 2;
  repeated string kinds = 3;
  // nw-316: `optional` so ABSENCE survives the RPC. A proto3 non-optional
  // `bool` cannot express "unset" — it decodes to `false` — so the tool's
  // documented default of `true` was unreachable through this hop no matter
  // what the caller sent, and `project-context X` seeded PPR from a different
  // member set than `project_context {"project":"X"}`. Wire-compatible: the
  // field number and type are unchanged; proto3 `optional` only adds presence
  // tracking.
  optional bool include_components = 4;
  string intent = 5;
  bool include_seeds = 6;
  // RFC3339 timestamp; when set, hard-filters Note/Section nodes by
  // `modified_at >= since`. Empty string = no filter.
  string since = 7;
  // Soft recency boost weight [0.0, 1.0+]. 0.0 disables the boost (default).
  double recency_weight = 8;
  // Half-life (days) for the recency boost decay. Ignored when weight=0.
  double recency_half_life_days = 9;
  // "concise" (default) trims per-node fields and uses a smaller default token
  // budget; "detailed" returns full metadata at the larger budget. Empty = concise.
  string response_format = 10;
  // Filter connected/seed nodes to these repos (display name / uid / path substring).
  repeated string repos = 11;
  // Keep only nodes whose location starts with this path prefix. Empty = no filter.
  string path_prefix = 12;
  // Keep only note/section nodes tagged with any of these tags (symbols always kept).
  repeated string tags = 13;
  // Drop note/section nodes tagged with any of these tags.
  repeated string exclude_tags = 14;
}
message ProjectContextResponse { string result_json = 1; }

// hub_nodes (typed request, JSON response)
message HubNodesRequest {
  int32 top_n = 1;
  string response_format = 2;
}
message HubNodesResponse { string result_json = 1; }

// ─── UI serving ─────────────────────────────────────────────────────

message ServeUiRequest {
  uint32 port = 1;
  bool open_browser = 2;
  bool watch = 3;
  string watch_repo_path = 4;
  string watch_instance_id = 5;
}

message ServeUiResponse {
  bool ok = 1;
  string message = 2;
  // The port the UI is actually reachable on after this call (0 when not
  // running). Differs from the requested port when the UI was already
  // running on an earlier port — clients must print THIS port, not the
  // one they asked for.
  uint32 port = 3;
  // Machine-readable error code (empty when ok). Currently defined:
  // "port_in_use" — the requested port is bound by a foreign process;
  // clients should map this to a non-zero exit without retrying.
  string error = 4;
}

message StopUiRequest {}

message StopUiResponse {
  bool ok = 1;
  string message = 2;
}

message EmbedRequest {
  string scope = 1;    // "all", "symbols", "notes", "headings"
  bool force = 2;
  uint32 batch_size = 3;
}

message EmbedResponse {
  uint32 succeeded = 1;
  uint32 failed = 2;
  // Embeddings rejected by the dimension guard (model mismatch), as opposed
  // to `failed` (the model errored). Zero from pre-2.2.1 daemons.
  uint32 rejected = 3;
  // Nodes present in the requested scope when eligibility was evaluated.
  uint64 scoped = 4;
  // Nodes selected for embedding after applying `force` and sidecar state.
  uint64 eligible = 5;
  // Scoped nodes omitted because their authoritative sidecar embedding exists.
  uint64 skipped = 6;
}

// ─── Impact Analysis (Phase 4) ──────────────────────────────────────

enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  SYMBOL_ADDED = 1;
  SYMBOL_REMOVED = 2;
  SIGNATURE_CHANGED = 3;
  SYMBOL_RENAMED = 4;
  SYMBOL_MOVED = 5;
  EXPORT_ADDED = 6;
  EXPORT_REMOVED = 7;
}

message AtomicChangeProto {
  ChangeKind kind = 1;
  string canonical_id = 2;
  string name = 3;
  optional string old_signature = 4;
  optional string new_signature = 5;
  optional string old_name = 6;
  optional string new_name = 7;
  optional string old_file = 8;
  optional string new_file = 9;
  string file_path = 10;
  string symbol_kind = 11;
}

message ImpactAnalysisRequest {
  repeated AtomicChangeProto changes = 1;
  string source_repo_url = 2;
  int32 max_depth = 3;
  bool include_tests = 4;
}

enum Severity {
  SEVERITY_BREAKING = 0;
  SEVERITY_WARNING = 1;
  SEVERITY_INFO = 2;
}

message ImpactItem {
  string change_canonical_id = 1;
  ChangeKind change_kind = 2;
  string affected_canonical_id = 3;
  string affected_name = 4;
  string affected_repo_url = 5;
  string affected_file = 6;
  int32 affected_line = 7;
  string affected_signature = 8;
  Severity severity = 9;
  string reason = 10;
}

message ImpactAnalysisResponse {
  repeated ImpactItem impacts = 1;
  int32 total_impacted_files = 2;
  int32 total_impacted_repos = 3;
  repeated string impacted_repo_urls = 4;
}

// ─── Flow Trace Continuation (Phase 4) ────────────────────────────

message TraceSpanProto {
  string trace_id = 1;
  string span_id = 2;
  optional string parent_span_id = 3;
  string canonical_id = 4;
  string name = 5;
  string repo_url = 6;
  string file_path = 7;
  int32 start_line = 8;
  repeated string callee_span_ids = 9;
  string source = 10;  // "local" or server name
}

message BoundarySymbolProto {
  string canonical_id = 1;
  string name = 2;
  string parent_span_id = 3;
}

message FlowTraceContinueRequest {
  string trace_id = 1;
  string entry_canonical_id = 2;
  string parent_span_id = 3;
  int32 remaining_depth = 4;
  repeated string visited_canonical_ids = 5;
}

message FlowTraceContinueResponse {
  repeated TraceSpanProto spans = 1;
  repeated BoundarySymbolProto boundaries = 2;
  bool truncated = 3;
}

// ─── Backup ─────────────────────────────────────────────────────────

// The daemon performs the entire backup in-process: it holds its own write
// lock (quiesce == lock-held), checkpoints, copies the on-disk files, and
// packages the snapshot to output_path. One RPC, no cross-call quiesce state.
message BackupRequest {
  string output_path = 1;   // daemon-local path (or s3://…) for the .nwsnap.zst
  bool include_clones = 2;  // full tier (include workspace/*.git)
}

message BackupResponse {
  string output_path = 1;
  string instance_id = 2;
  string tier = 3;
  string nestweaver_version = 4;
  uint64 repo_count = 5;
  uint64 symbol_count = 6;
  uint64 db_size_bytes = 7;
  uint64 total_compressed = 8;
}

// ─── Service ─────────────────────────────────────────────────────────

service NestWeaverDaemon {
  // Lifecycle
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);

  // Indexing (server-streaming)
  rpc IndexRepo(IndexRepoRequest) returns (stream IndexProgress);
  rpc IndexVault(IndexVaultRequest) returns (stream IndexProgress);
  rpc RefreshVaultSince(RefreshVaultSinceRequest) returns (stream IndexProgress);
  rpc RefreshBrain(RefreshBrainRequest) returns (stream IndexProgress);
  rpc ReindexSearch(ReindexSearchRequest) returns (ReindexSearchResponse);

  // Embedding
  rpc PlanEmbed(EmbedRequest) returns (EmbedResponse);
  rpc Embed(EmbedRequest) returns (EmbedResponse);

  // Write RPCs
  rpc MaterializeProjects(MaterializeProjectsRequest) returns (stream IndexProgress);
  rpc RemoveVault(RemoveVaultRequest) returns (RemoveVaultResponse);
  rpc RemoveRepo(RemoveRepoRequest) returns (RemoveRepoResponse);
  rpc RemoveProject(RemoveProjectRequest) returns (RemoveProjectResponse);
  rpc PruneStale(PruneStaleRequest) returns (PruneStaleResponse);
  rpc CompactEmbeddings(CompactEmbeddingsRequest) returns (CompactEmbeddingsResponse);
  rpc MergeInstance(MergeInstanceRequest) returns (MergeInstanceResponse);
  rpc PurgeInstance(PurgeInstanceRequest) returns (stream IndexProgress);

  // Watching
  rpc WatchVault(WatchVaultRequest) returns (WatchVaultResponse);
  rpc WatchCode(WatchCodeRequest) returns (WatchCodeResponse);
  rpc StopWatch(StopWatchRequest) returns (StopWatchResponse);

  // Backup — daemon quiesces itself (holds the write lock), checkpoints,
  // copies, and packages the snapshot. One RPC, no cross-call quiesce state.
  rpc Backup(BackupRequest) returns (BackupResponse);

  // Export
  rpc ExportGraph(JsonRequest) returns (JsonResponse);

  // UI
  rpc ServeUi(ServeUiRequest) returns (ServeUiResponse);
  rpc StopUi(StopUiRequest) returns (StopUiResponse);

  // Phase 4 — typed RPCs
  rpc FlowTraceContinue(FlowTraceContinueRequest) returns (FlowTraceContinueResponse);

  // Read RPCs — typed hot-path
  rpc Search(BrainSearchRequest) returns (BrainSearchResponse);
  rpc GetContext(BrainContextRequest) returns (BrainContextResponse);
  // CODE-only context: PPR over the symbol graph, no notes and no alias
  // resolution. Distinct from GetContext, which runs the hybrid. `nestweaver
  // context` had no RPC of its own, so its daemon route sent the hybrid while
  // its direct path ran code-only PPR — one command, two algorithms.
  rpc CodeContext(JsonRequest) returns (JsonResponse);
  rpc GetProjectContext(ProjectContextRequest) returns (ProjectContextResponse);
  rpc GetNote(NoteGetRequest) returns (NoteGetResponse);
  rpc BrainStatus(BrainStatusRequest) returns (BrainStatusResponse);
  rpc BrainStatusJson(JsonRequest) returns (JsonResponse);
  rpc RepoStates(RepoStatesRequest) returns (RepoStatesResponse);
  rpc HubNodes(HubNodesRequest) returns (HubNodesResponse);

  // Read RPCs — JSON pass-through
  rpc GetBacklinks(JsonRequest) returns (JsonResponse);
  rpc FlowTrace(JsonRequest) returns (JsonResponse);
  rpc BlastRadius(JsonRequest) returns (JsonResponse);
  rpc Impact(JsonRequest) returns (JsonResponse);

  // Phase 4: typed impact analysis with Chianti-style atomic changes
  rpc ImpactAnalysis(ImpactAnalysisRequest) returns (ImpactAnalysisResponse);
  rpc BrainGuide(JsonRequest) returns (JsonResponse);
  rpc BrainDiff(JsonRequest) returns (JsonResponse);
  rpc ReadSymbols(JsonRequest) returns (JsonResponse);
  rpc RegexSearch(JsonRequest) returns (JsonResponse);
  rpc CountPatterns(JsonRequest) returns (JsonResponse);
  rpc ListContracts(ListContractsRequest) returns (ListContractsResponse);
  rpc CrossRepoContracts(JsonRequest) returns (JsonResponse);
  rpc ContractDrift(JsonRequest) returns (JsonResponse);
  rpc DeadCode(JsonRequest) returns (JsonResponse);
  rpc BrainBrokenLinks(JsonRequest) returns (JsonResponse);
  rpc BrainOrphanDocuments(JsonRequest) returns (JsonResponse);
  rpc BrainTopicClusters(JsonRequest) returns (JsonResponse);
  rpc BrainTagGraph(JsonRequest) returns (JsonResponse);
  rpc BrainDocStats(JsonRequest) returns (JsonResponse);
  rpc BrainMemoryLint(JsonRequest) returns (JsonResponse);
  rpc BrainMemoryConsolidate(JsonRequest) returns (JsonResponse);
  rpc BrainMemoryRelated(JsonRequest) returns (JsonResponse);
  rpc DetectChanges(JsonRequest) returns (JsonResponse);
  rpc AffectedTests(JsonRequest) returns (JsonResponse);
  rpc Clusters(JsonRequest) returns (JsonResponse);
  rpc StaleCheck(JsonRequest) returns (JsonResponse);
  rpc BridgeNodes(JsonRequest) returns (JsonResponse);
  rpc GetSummary(JsonRequest) returns (JsonResponse);
  rpc Investigate(JsonRequest) returns (JsonResponse);
  rpc InvestigateExpand(JsonRequest) returns (JsonResponse);
  rpc InvestigateHydrate(JsonRequest) returns (JsonResponse);
  rpc SetExtension(JsonRequest) returns (JsonResponse);
  rpc QueryExtensions(JsonRequest) returns (JsonResponse);

  // Read RPCs — JSON pass-through (CLI read commands routed via daemon)
  rpc ListReposJson(JsonRequest) returns (JsonResponse);
  rpc ListVaultsJson(JsonRequest) returns (JsonResponse);
  rpc EmbeddingDimension(JsonRequest) returns (JsonResponse);
  rpc ListServicesJson(JsonRequest) returns (JsonResponse);
  rpc ServiceSummaryJson(JsonRequest) returns (JsonResponse);
  rpc ListProjectsJson(JsonRequest) returns (JsonResponse);
  rpc SearchSymbols(JsonRequest) returns (JsonResponse);
  rpc SymbolLookup(JsonRequest) returns (JsonResponse);
  rpc RepoMapJson(JsonRequest) returns (JsonResponse);
  rpc SuggestLinksJson(JsonRequest) returns (JsonResponse);
  rpc DetectImplicitProjectsJson(JsonRequest) returns (JsonResponse);
  rpc PrImpactJson(JsonRequest) returns (JsonResponse);
}
