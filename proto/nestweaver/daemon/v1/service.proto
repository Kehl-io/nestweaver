syntax = "proto3";

package nestweaver.daemon.v1;

// ─── Lifecycle ───────────────────────────────────────────────────────

message HealthCheckRequest {}

message HealthCheckResponse {
  string version = 1;
  string instance_id = 2;
  string db_path = 3;
  uint64 uptime_seconds = 4;
  uint32 active_connections = 5;
  reserved 6;
  reserved "db_opened_at";
}

message ShutdownRequest {}

message ShutdownResponse {
  bool ok = 1;
}

// ─── Indexing ────────────────────────────────────────────────────────

message IndexRepoRequest {
  string repo_path = 1;
  string name = 2;
  bool force = 3;
  bool with_trigrams = 4;
  bool with_git_activity = 5;
}

message IndexVaultRequest {
  string vault_path = 1;
  string vault_name = 2;
  repeated string extra_ignore_patterns = 3;
  string instance_id = 4;
}

message RefreshBrainRequest {}

message ReindexSearchRequest {}

message ReindexSearchResponse {
  int32 document_count = 1;
}

// ─── Watching ───────────────────────────────────────────────────────

message WatchVaultRequest {
  string vault_path = 1;
  string vault_name = 2;
  string instance_id = 3;
  repeated string extra_ignore_patterns = 4;
}

message WatchVaultResponse {
  bool ok = 1;
  string message = 2;
}

message WatchCodeRequest {
  string repo_path = 1;
  string instance_id = 2;
}

message WatchCodeResponse {
  bool ok = 1;
  string message = 2;
}

message StopWatchRequest {}

message StopWatchResponse {
  bool ok = 1;
}

enum Phase {
  DISCOVERING = 0;
  PARSING = 1;
  RESOLVING = 2;
  WRITING = 3;
  PAGERANK = 4;
  DONE = 5;
  ERROR = 6;
}

message IndexProgress {
  Phase phase = 1;
  string message = 2;
  uint64 files_processed = 3;
  uint64 files_total = 4;
  uint64 symbols_found = 5;
}

// ─── Write RPCs ─────────────────────────────────────────────────────

message MaterializeProjectsRequest {
  string config_path = 1;
  string instance_id = 2;
}

message RemoveVaultRequest {
  string vault_uid = 1;
}

message RemoveVaultResponse {
  uint64 notes_deleted = 1;
}

message RemoveRepoRequest {
  string repo_uid = 1;
}

message RemoveRepoResponse {
  uint64 files_deleted = 1;
  uint64 symbols_deleted = 2;
}

message RemoveProjectRequest {
  string project_uid = 1;
}

message RemoveProjectResponse {
  string project_name = 1;
}

message PruneStaleRequest {}

message PruneStaleResponse {
  repeated string removed_repos = 1;
  repeated string removed_vaults = 2;
}

message MergeInstanceRequest {
  string from_id = 1;
  string to_id = 2;
}

message MergeInstanceResponse {
  uint64 vaults_reparented = 1;
  uint64 repos_reparented = 2;
  uint64 projects_reparented = 3;
  repeated string discarded_vaults = 4;
}

message PurgeInstanceRequest {
  string instance_id = 1;
}

// ─── JSON pass-through for read RPCs ─────────────────────────────────

message JsonRequest {
  string args_json = 1;
}

message JsonResponse {
  string result_json = 1;
}

// ─── Typed messages for hot-path RPCs ────────────────────────────────

// brain_search
message BrainSearchRequest {
  string query = 1;
  int32 limit = 2;
  optional string response_format = 3;
  bool include_bodies = 4;
  bool prf = 5;
  bool rerank = 6;
  optional string root = 7;
}
message BrainSearchResponse {
  string query = 1;
  string engine = 2;
  int32 total_matches = 3;
  repeated SearchResultItem results = 4;
  // F7 PRF-mined expansion terms (empty unless prf=true on the request).
  repeated string expansion_terms = 5;
}
message SearchResultItem {
  string uid = 1;
  string kind = 2;
  string title = 3;
  double score = 4;
  optional string location = 5;
  repeated string matched_headings = 6;
  optional string inline_body = 7;
}

// brain_status
message BrainStatusRequest {}
message BrainStatusResponse {
  int32 vault_count = 1;
  int32 notes = 2;
  int32 headings = 3;
  int32 sections = 4;
  int32 tags = 5;
  int32 wikilinks = 6;
  int32 repo_count = 7;
  bool tantivy_available = 8;
  int32 tantivy_doc_count = 9;
  bool indexing_active = 10;
  string indexing_repo = 11;  // repo currently being indexed (empty if idle)
  int32 queue_depth = 12;     // number of pending + running jobs
}

// repo_states — per-repo indexed SHA and metadata for staleness comparison
message RepoStatesRequest {}
message RepoState {
  string repo_uid = 1;
  string repo_url = 2;
  string repo_name = 3;
  string indexed_sha = 4;
  int64 symbol_count = 5;
}
message RepoStatesResponse {
  repeated RepoState repos = 1;
}

// note_get
message NoteGetRequest {
  optional string uid = 1;
  optional string title = 2;
  bool include_body = 3;
  repeated string sections = 4;
}
message NoteGetResponse {
  string uid = 1;
  string title = 2;
  string path = 3;
  string note_kind = 4;
  int32 word_count = 5;
  optional string body = 6;
  int32 section_count = 7;
}

// brain_context (typed request, JSON response)
message BrainContextRequest {
  repeated string seeds = 1;
  int32 token_budget = 2;
  string response_format = 3;
  repeated string repos = 4;
  repeated string vaults = 5;
  repeated string kinds = 6;
  string path_prefix = 7;
  repeated string tags = 8;
  repeated string exclude_tags = 9;
  double weight_ppr = 10;
  double weight_bm25 = 11;
  string intent = 12;
  bool include_seeds = 13;
  bool include_bodies = 14;
  string root = 15;
  bool prf = 16;
  bool rerank = 17;
  double weight_semantic = 18;
  string since = 19;
  double recency_weight = 20;
  double recency_half_life_days = 21;
}
message BrainContextResponse { string result_json = 1; }

// project_context (typed request, JSON response)
message ProjectContextRequest {
  string project = 1;
  int32 token_budget = 2;
  repeated string kinds = 3;
  bool include_components = 4;
  string intent = 5;
  bool include_seeds = 6;
  // RFC3339 timestamp; when set, hard-filters Note/Section nodes by
  // `modified_at >= since`. Empty string = no filter.
  string since = 7;
  // Soft recency boost weight [0.0, 1.0+]. 0.0 disables the boost (default).
  double recency_weight = 8;
  // Half-life (days) for the recency boost decay. Ignored when weight=0.
  double recency_half_life_days = 9;
}
message ProjectContextResponse { string result_json = 1; }

// hub_nodes (typed request, JSON response)
message HubNodesRequest {
  int32 top_n = 1;
  string response_format = 2;
}
message HubNodesResponse { string result_json = 1; }

// ─── UI serving ─────────────────────────────────────────────────────

message ServeUiRequest {
  uint32 port = 1;
  bool open_browser = 2;
  bool watch = 3;
  string watch_repo_path = 4;
  string watch_instance_id = 5;
}

message ServeUiResponse {
  bool ok = 1;
  string message = 2;
}

message EmbedRequest {
  string scope = 1;    // "all", "symbols", "notes", "headings"
  bool force = 2;
  uint32 batch_size = 3;
}

message EmbedResponse {
  uint32 succeeded = 1;
  uint32 failed = 2;
}

// ─── Service ─────────────────────────────────────────────────────────

service NestWeaverDaemon {
  // Lifecycle
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);

  // Indexing (server-streaming)
  rpc IndexRepo(IndexRepoRequest) returns (stream IndexProgress);
  rpc IndexVault(IndexVaultRequest) returns (stream IndexProgress);
  rpc RefreshBrain(RefreshBrainRequest) returns (stream IndexProgress);
  rpc ReindexSearch(ReindexSearchRequest) returns (ReindexSearchResponse);

  // Embedding
  rpc Embed(EmbedRequest) returns (EmbedResponse);

  // Write RPCs
  rpc MaterializeProjects(MaterializeProjectsRequest) returns (stream IndexProgress);
  rpc RemoveVault(RemoveVaultRequest) returns (RemoveVaultResponse);
  rpc RemoveRepo(RemoveRepoRequest) returns (RemoveRepoResponse);
  rpc RemoveProject(RemoveProjectRequest) returns (RemoveProjectResponse);
  rpc PruneStale(PruneStaleRequest) returns (PruneStaleResponse);
  rpc MergeInstance(MergeInstanceRequest) returns (MergeInstanceResponse);
  rpc PurgeInstance(PurgeInstanceRequest) returns (stream IndexProgress);

  // Watching
  rpc WatchVault(WatchVaultRequest) returns (WatchVaultResponse);
  rpc WatchCode(WatchCodeRequest) returns (WatchCodeResponse);
  rpc StopWatch(StopWatchRequest) returns (StopWatchResponse);

  // Export
  rpc ExportGraph(JsonRequest) returns (JsonResponse);

  // UI
  rpc ServeUi(ServeUiRequest) returns (ServeUiResponse);

  // Read RPCs — typed hot-path
  rpc Search(BrainSearchRequest) returns (BrainSearchResponse);
  rpc GetContext(BrainContextRequest) returns (BrainContextResponse);
  rpc GetProjectContext(ProjectContextRequest) returns (ProjectContextResponse);
  rpc GetNote(NoteGetRequest) returns (NoteGetResponse);
  rpc BrainStatus(BrainStatusRequest) returns (BrainStatusResponse);
  rpc BrainStatusJson(JsonRequest) returns (JsonResponse);
  rpc RepoStates(RepoStatesRequest) returns (RepoStatesResponse);
  rpc HubNodes(HubNodesRequest) returns (HubNodesResponse);

  // Read RPCs — JSON pass-through
  rpc GetBacklinks(JsonRequest) returns (JsonResponse);
  rpc FlowTrace(JsonRequest) returns (JsonResponse);
  rpc BlastRadius(JsonRequest) returns (JsonResponse);
  rpc Impact(JsonRequest) returns (JsonResponse);
  rpc BrainGuide(JsonRequest) returns (JsonResponse);
  rpc BrainDiff(JsonRequest) returns (JsonResponse);
  rpc ReadSymbols(JsonRequest) returns (JsonResponse);
  rpc RegexSearch(JsonRequest) returns (JsonResponse);
  rpc CountPatterns(JsonRequest) returns (JsonResponse);
  rpc CrossRepoContracts(JsonRequest) returns (JsonResponse);
  rpc ContractDrift(JsonRequest) returns (JsonResponse);
  rpc DeadCode(JsonRequest) returns (JsonResponse);
  rpc BrainBrokenLinks(JsonRequest) returns (JsonResponse);
  rpc BrainOrphanDocuments(JsonRequest) returns (JsonResponse);
  rpc BrainTopicClusters(JsonRequest) returns (JsonResponse);
  rpc BrainTagGraph(JsonRequest) returns (JsonResponse);
  rpc BrainDocStats(JsonRequest) returns (JsonResponse);
  rpc BrainMemoryLint(JsonRequest) returns (JsonResponse);
  rpc BrainMemoryConsolidate(JsonRequest) returns (JsonResponse);
  rpc BrainMemoryRelated(JsonRequest) returns (JsonResponse);
  rpc DetectChanges(JsonRequest) returns (JsonResponse);
  rpc AffectedTests(JsonRequest) returns (JsonResponse);
  rpc Clusters(JsonRequest) returns (JsonResponse);
  rpc StaleCheck(JsonRequest) returns (JsonResponse);
  rpc BridgeNodes(JsonRequest) returns (JsonResponse);
  rpc GetSummary(JsonRequest) returns (JsonResponse);
  rpc Investigate(JsonRequest) returns (JsonResponse);
  rpc InvestigateExpand(JsonRequest) returns (JsonResponse);
  rpc InvestigateHydrate(JsonRequest) returns (JsonResponse);
  rpc SetExtension(JsonRequest) returns (JsonResponse);
  rpc QueryExtensions(JsonRequest) returns (JsonResponse);

  // Read RPCs — JSON pass-through (CLI read commands routed via daemon)
  rpc ListReposJson(JsonRequest) returns (JsonResponse);
  rpc ListVaultsJson(JsonRequest) returns (JsonResponse);
  rpc EmbeddingDimension(JsonRequest) returns (JsonResponse);
  rpc ListServicesJson(JsonRequest) returns (JsonResponse);
  rpc ServiceSummaryJson(JsonRequest) returns (JsonResponse);
  rpc ListProjectsJson(JsonRequest) returns (JsonResponse);
  rpc SearchSymbols(JsonRequest) returns (JsonResponse);
  rpc SymbolLookup(JsonRequest) returns (JsonResponse);
  rpc RepoMapJson(JsonRequest) returns (JsonResponse);
  rpc SuggestLinksJson(JsonRequest) returns (JsonResponse);
  rpc DetectImplicitProjectsJson(JsonRequest) returns (JsonResponse);
  rpc PrImpactJson(JsonRequest) returns (JsonResponse);
}
