[env]
# Build lbug from source instead of linking its published prebuilt archive.
# The prebuilt hides its zstd Huffman ASM symbols in the ELF, which breaks the
# link on x86_64 Linux; compiling from source resolves those symbols and keeps
# cross-platform release builds reproducible. See 6768374, "fix(ci): eliminate
# zstd link errors and skip daemon tests on Linux".
LBUG_BUILD_FROM_SOURCE = { value = "1", force = true }

# No linker workaround is needed here, and none should be added. liblbug.a
# vendors zstd, exports its ZSTD_* symbols, and is linked +whole-archive, so
# every binary already carries a complete libzstd; Rust code reaches that one
# copy through `nestweaver_store::zstd`. Adding the `zstd` crate back would pull
# in zstd-sys, compile a second copy, and make rust-lld reject every link with
# duplicate symbols. The historical response was to tell the linker to tolerate
# duplicates, which suppressed the error without removing the second copy: the
# linker silently picked one definition and the other stayed in the binary.
# `exactly_one_copy_of_zstd_is_linked` in tests/cli_test.rs guards both halves.
#
# mold is deliberately NOT set here: CI installs it, a contributor may not have
# it, and a missing linker is a worse first experience than a slower one. CI
# adds it via CARGO_TARGET_<TRIPLE>_RUSTFLAGS.
