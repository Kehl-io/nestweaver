[package]
name = "nestweaver-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[dependencies]
nestweaver-engine = { workspace = true }
nestweaver-store = { workspace = true }
nestweaver-schema = { workspace = true }
nestweaver-proto = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net"], optional = true }
tokio-stream = { workspace = true, optional = true }
tower = { version = "0.5", optional = true }
hyper-util = { version = "0.1", optional = true }
dirs = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
daemon = ["dep:dirs", "dep:nestweaver-proto", "dep:tonic", "dep:tokio", "dep:tokio-stream", "dep:tower", "dep:hyper-util", "dep:libc"]
embed = ["nestweaver-engine/embed"]

[dev-dependencies]
tempfile = "3"
