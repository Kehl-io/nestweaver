[package]
name = "nestweaver-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[dependencies]
nestweaver-algorithms = { workspace = true }
nestweaver-schema = { workspace = true }
lbug = "=0.19.1"
# lbug's static archive still declares OpenSSL as a dynamic native dependency.
# Unify it with Cargo's vendored OpenSSL build so release binaries do not depend
# on a package-manager installation at runtime.
openssl-sys = { version = "0.9", features = ["vendored"] }
lru = "0.18"
tantivy = { version = "0.26", default-features = false, features = ["mmap", "stopwords", "lz4-compression", "stemmer"] }
regex = "1.12"
regex-syntax = "0.8"
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
blake3 = { workspace = true }
rayon = { workspace = true }
memmap2 = { workspace = true }
rmp-serde = "1"
csv = "1"
tempfile = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
# tree-sitter-sequel 0.3.x requires cc ~1.2.1; keep the workspace build
# dependency on the same resolvable line until that grammar relaxes its bound.
cc = "~1.2"
serde_json = { workspace = true }
toml = "1.1"

[dev-dependencies]
tempfile = "3"
toml = "1.1"
