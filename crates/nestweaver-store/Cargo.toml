[package]
name = "nestweaver-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[dependencies]
nestweaver-algorithms = { workspace = true }
nestweaver-schema = { workspace = true }
lbug = "=0.18.2"
lru = "0.18"
tantivy = { version = "0.26", default-features = false, features = ["mmap", "stopwords", "lz4-compression", "stemmer"] }
regex = "1.12"
regex-syntax = "0.8"
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
rayon = { workspace = true }
zstd = "0.13"
rmp-serde = "1"
csv = "1"
tempfile = { workspace = true }

[build-dependencies]
# tree-sitter-sequel 0.3.x requires cc ~1.2.1; keep the workspace build
# dependency on the same resolvable line until that grammar relaxes its bound.
cc = "~1.2"
serde_json = { workspace = true }
toml = "1.1"

[dev-dependencies]
tempfile = "3"
toml = "1.1"
