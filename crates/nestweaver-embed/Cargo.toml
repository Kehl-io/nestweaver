[package]
name = "nestweaver-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local embedding inference for NestWeaver semantic search"

[dependencies]
nestweaver-schema = { workspace = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
hf-hub = { version = "1", default-features = false, features = ["blocking", "rustls-tls"] }
tokenizers = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "rustls"] }
tracing = "0.1"
indicatif = "0.18"
dirs = "6"
sha2 = { workspace = true }
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal"]
