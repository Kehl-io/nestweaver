[package]
name = "nestweaver-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "gRPC daemon for NestWeaver — serves read RPCs over a Unix domain socket"

[dependencies]
nestweaver-proto = { workspace = true }
nestweaver-engine = { workspace = true }
nestweaver-store = { workspace = true }
nestweaver-schema = { workspace = true }
nestweaver-mcp = { workspace = true }
nestweaver-web = { workspace = true }
nestweaver-embed = { workspace = true, optional = true }
axum = "0.8"
tonic = { workspace = true }
prost = { workspace = true }
tokio = { version = "1", features = ["full"] }
tokio-stream = { workspace = true, features = ["net"] }
tower = "0.5"
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde_json = { workspace = true }
rmp-serde = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
libc = "0.2"
dirs = "6"
governor = { version = "0.8", features = ["dashmap"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[features]
embed = ["dep:nestweaver-embed", "nestweaver-engine/embed", "nestweaver-mcp/embed"]
