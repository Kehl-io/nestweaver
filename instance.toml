# NestWeaver server instance configuration (Docker deployment).
#
# docker-compose.yml mounts this file read-only at
# /etc/nestweaver/instance.toml. Edit it to declare the repos this server
# indexes, then `docker compose up -d`. Repos can also be added at runtime via
# the admin API or git webhooks.

instance_id = "nestweaver-server"

# Repos this server indexes. Leave this out entirely to start empty, then add
# one [[repos]] block per repo (or add them at runtime via the admin API /
# webhooks), e.g.:
#   [[repos]]
#   url = "https://github.com/your-org/your-repo"
#   branch = "main"

[snapshot_storage]
backend = "local"
path = "/data/nestweaver/snapshots"

[workspace]
backend = "local"
path = "/data/nestweaver/workspace"

[inference]
# Embeddings are optional on the server — BM25 + PageRank is the baseline and
# needs no inference endpoint. To enable semantic search, point this at an
# Ollama / OpenAI-compatible endpoint and pick models.
endpoint = "http://localhost:11434"
embedding_model = "nomic-embed-text"
summary_model = "qwen2.5-coder:7b"

[git]
# How the server authenticates to clone/fetch private repos: "ssh" or "token".
credential_method = "ssh"

# [authz] — optional per-repo authorization for Blast Radius (host-agnostic).
# Absent/empty => disabled => every caller sees all repos (zero behavior change).
# Any rule enables the policy and is fail-closed: unknown tokens see nothing.
# [authz.rules]
# "team-frontend-token" = ["github.com/acme/frontend*"]
# "team-backend-token"  = ["github.com/acme/backend*"]

# [pr_impact] — what `pr-impact --strict` / the strict pre-push hook blocks on.
# [pr_impact]
# strict_block_on_breaking = true    # block on a contract-verified breaking change (default)
# strict_block_on_high_risk = false  # also block on a complete High-risk run (default off)
