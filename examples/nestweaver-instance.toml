# Example NestWeaver instance config
#
# This file declares the repos in your project, how they relate to each
# other, and what cross-cutting features span them.
#
# Usage:
#   nestweaver index --repo ./web-client --db ./project.lbug
#   nestweaver index --repo ./api-service --db ./project.lbug
#   nestweaver index --repo ./mobile-app --db ./project.lbug
#   nestweaver index --repo ./device-firmware --db ./project.lbug
#
#   nestweaver suggest-links --db ./project.lbug
#   nestweaver list-links --config ./nestweaver-instance.toml
#   nestweaver context --feature device-onboarding --config ./nestweaver-instance.toml --db ./project.lbug

instance_id = "acme-platform"

[snapshot_storage]
backend = "local"
path = "~/.local/share/nestweaver/acme/snapshots"

[workspace]
backend = "local"
path = "~/.local/share/nestweaver/acme/workspace"

[inference]
# Required connection settings for the remote inference subsystem. This is
# separate from the semantic-search subsystem configured in [embedding] below.
endpoint = "http://localhost:11434"
embedding_model = "nomic-embed-text"
summary_model = "qwen2.5-coder:7b"
# For a keyed embedding gateway (OpenAI, Azure, etc.), set the API key via the
# NESTWEAVER_EMBED_API_KEY environment variable — it is sent as a bearer token and
# is NEVER written to config, the graph, or a snapshot. Omit it for local Ollama.

# [embedding] is independently configured local/external semantic search plus
# retrieval fusion. Its defaults apply when omitted; it does not inherit values
# from [inference]. An external endpoint is authoritative: failures are returned
# directly and never fall back to a local model.
[embedding]
model_id = "sentence-transformers/all-MiniLM-L6-v2"
cache_dir = "~/.cache/nestweaver/models"
# auto: Metal in a Metal-enabled build; CPU only when Metal is not compiled.
#       A Metal failure is reported; auto does not retry on CPU.
# metal: require compiled Metal plus successful device and full inference probes;
#        a failure is reported and CPU is never selected.
# cpu: always select CPU and never probe Metal.
accelerator = "auto"
# Daemon startup is cache-only and never downloads model files. If the cache is
# empty, stop the daemon and run:
# nestweaver embed --db <path> --local --model-id <id> --cache-dir <path>
weight_ppr = 0.40      # graph structure (Personalized PageRank)
weight_bm25 = 0.25     # text match
weight_semantic = 0.35 # embedding similarity

[git]
credential_method = "gh"

# ── Repositories ──────────────────────────────────────────────────────────
# `url` is required. `name` is optional, and `type` is optional: `code` is the
# default; use `vault` for Markdown repositories.

[[repos]]
url = "https://github.com/acme/web-client"
name = "web-client"

[[repos]]
url = "https://github.com/acme/api-service"

[[repos]]
url = "https://github.com/acme/mobile-app"

[[repos]]
url = "https://github.com/acme/device-firmware"

# ── Cross-repo links ─────────────────────────────────────────────────────
#
# Declare how repos communicate. NestWeaver auto-detects package-level
# dependencies from manifests (package.json, go.mod, etc.). Use [[links]]
# for protocol-level relationships that can't be auto-detected.

[[links]]
from = "web-client"
to = "api-service"
type = "http-api"
description = "React web app calls REST API"
endpoints = ["/api/users", "/api/devices", "/api/sessions"]

[[links]]
from = "mobile-app"
to = "api-service"
type = "http-api"
description = "React Native app calls REST API"
endpoints = ["/api/users", "/api/devices", "/api/sessions"]

[[links]]
from = "mobile-app"
to = "device-firmware"
type = "ble"
description = "App connects to device via BLE"
identifiers = ["6E400001-B5A3-F393-E0A9-E50E24DCCA9E"]

[[links]]
from = "api-service"
to = "device-firmware"
type = "http-api"
description = "Backend pushes OTA firmware updates"
endpoints = ["/api/firmware/update"]

# ── Feature bundles ───────────────────────────────────────────────────────
#
# Group entry points across repos into named features. An agent says
# "I'm working on device onboarding" and gets context from all repos.

[[features]]
name = "device-onboarding"
description = "Device discovery, BLE pairing, cloud registration, initial config"
repos = ["mobile-app", "device-firmware", "api-service"]
entry_points = ["BLEScanner", "pairDevice", "registerDevice", "initConfig"]

[[features]]
name = "user-auth"
description = "Login, signup, OAuth, session management"
repos = ["web-client", "mobile-app", "api-service"]
entry_points = ["LoginForm", "useAuth", "authMiddleware", "refreshToken"]

[[features]]
name = "data-sync"
description = "Real-time data sync from device through backend to clients"
repos = ["device-firmware", "api-service", "web-client", "mobile-app"]
entry_points = ["sendReading", "ingestData", "useRealtimeData", "DataStream"]

# ── Projects ─────────────────────────────────────────────────────────────
#
# Projects aggregate notes, symbols, and components into named units.
# They connect vault documentation to code repos for unified retrieval.

[[projects]]
name = "device-onboarding"
description = "End-to-end device onboarding: discovery, pairing, registration"
aliases = ["onboarding", "DO"]
vault_folder = "Projects/device-onboarding"
repos = ["mobile-app", "device-firmware", "api-service"]
features = ["device-onboarding"]
components = ["ble-scanner", "device-registry"]

[[projects]]
name = "platform"
description = "Top-level platform composite"
components = ["device-onboarding", "user-auth"]

# ── Cross-domain config ──────────────────────────────────────────────────
#
# Tune how NestWeaver bridges notes to code symbols.

[cross_domain]
stoplist_extend = ["Platform", "Service", "Manager"]
min_symbol_name_length = 4

# ── MCP servers (for wiki source ingestion) ──────────────────────────────
#
# Declare external MCP servers that NestWeaver can call to fetch content
# from wikis, project trackers, or other knowledge sources.

