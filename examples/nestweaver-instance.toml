# CONFLUENCE_URL = "https://yoursite.atlassian.net"
# CONFLUENCE_API_TOKEN = "your-token"

# ── Server mode ──────────────────────────────────────────────────────────
# Uncomment to enable server mode features.

# Server-mode settings. Note: bind, auth_token, admin_token, and webhook_secret
# come from CLI flags (--bind, --auth-token, --admin-token, --webhook-secret)
# or their corresponding environment variables, not the config file.

# [server.indexing]
# workers = 8
# min_poll = "45s"
# max_poll = "8h"

