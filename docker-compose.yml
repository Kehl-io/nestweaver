services:
  # One-shot: generate self-signed TLS certs into the shared volume before the
  # server starts. A non-loopback bind (0.0.0.0) is rejected at startup without
  # TLS (validate_bind_security), so the daemon cannot boot without these certs.
  # Idempotent: only generates when the cert is absent, so restarts reuse it.
  # For a real deployment, replace this with your own PKI or terminate TLS at a
  # reverse proxy and bind the daemon to 127.0.0.1 instead.
  init-tls:
    build: .
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /data/nestweaver/tls/server.pem ]; then
          nestweaver server init-tls \
            --output-dir /data/nestweaver/tls \
            --san localhost --san nestweaver --san 127.0.0.1
        fi
    volumes:
      - nestweaver-data:/data/nestweaver

  nestweaver:
    build: .
    # image: ghcr.io/kehl-io/nestweaver:latest  # when published
    depends_on:
      init-tls:
        condition: service_completed_successfully
    ports:
      - "9378:9378"   # gRPC
      - "9379:9379"   # MCP-over-HTTP + webhook + admin API
    volumes:
      - ./instance.toml:/etc/nestweaver/instance.toml:ro
      - nestweaver-data:/data/nestweaver
    environment:
      - NESTWEAVER_AUTH_TOKEN=${NESTWEAVER_AUTH_TOKEN}
      - NESTWEAVER_ADMIN_TOKEN=${NESTWEAVER_ADMIN_TOKEN}
      - NESTWEAVER_WEBHOOK_SECRET=${NESTWEAVER_WEBHOOK_SECRET}
    command:
      [
        "daemon", "run",
        "--server",
        "--bind", "0.0.0.0:9378",
        "--tls-cert", "/data/nestweaver/tls/server.pem",
        "--tls-key", "/data/nestweaver/tls/server-key.pem",
        "--db", "/data/nestweaver/brain.lbug",
        "--config", "/etc/nestweaver/instance.toml"
      ]
    restart: unless-stopped
    # Docker sends SIGTERM, which runs the daemon's graceful drain with every
    # listener still up, then SIGKILLs at this deadline. 30s sat far below the
    # 660s drain ceiling, so `docker compose stop` during a large index reliably
    # SIGKILLed the daemon mid-write — the nw-126 stale-WAL crash, on a 30s fuse.
    #
    # Matched to the drain ceiling + 30s, the same budget `nestweaver daemon
    # stop` uses. This is still a HARD DEADLINE that Docker enforces and the
    # daemon cannot extend: a write running at 690s is SIGKILLed anyway. Raise
    # it (and NESTWEAVER_DRAIN_TIMEOUT_SECS with it) if your indexes run longer.
    # See docs/guide/daemon-shutdown.md.
    stop_grace_period: 690s

volumes:
  nestweaver-data:
